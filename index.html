<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWA — Launch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #ffffff;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border: 2px solid #222;
            background: #fff;
        }
        h1 {
            font-size: 26px;
            border-bottom: 2px solid #222;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .wallet-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f8f8;
            margin-bottom: 20px;
        }
        #connectButton {
            font-family: 'Courier New', Courier, monospace;
            background: #222;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            min-width: 160px;
        }
        #connectButton:hover {
            background: #444;
        }
        #connectButton.connected {
            background: #2a7d4f;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        input,
        select {
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #888;
            background: #fafafa;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #222;
            background: #fff;
        }
        .hint {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }
        .action-button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            background: #222;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-top: 5px;
        }
        .action-button:hover:not(:disabled) {
            background: #000;
        }
        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-message {
            margin-top: 15px;
            padding: 12px;
            background: #f4f4f4;
            font-size: 14px;
            border-left: 4px solid #888;
            min-height: 30px;
        }
        .status-message.error {
            border-left-color: #c0392b;
            background: #fdf0ed;
        }
        .status-message.success {
            border-left-color: #2a7d4f;
            background: #edf7f2;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
            text-align: center;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⌨️ MWA · LAUNCH</h1>

        <div class="wallet-section">
            <span id="walletStatus">⛓️ Not connected</span>
            <button id="connectButton">Connect MetaMask</button>
        </div>

        <form id="launchForm">
            <div class="form-group">
                <label>Token Name</label>
                <input type="text" id="tokenName" placeholder="My Token" value="Test Token">
            </div>
            <div class="form-group">
                <label>Token Symbol</label>
                <input type="text" id="tokenSymbol" placeholder="TEST" value="TEST">
            </div>
            <div class="form-group">
                <label>Total Supply</label>
                <input type="number" id="tokenSupply" value="1000000">
            </div>
            <div class="form-group">
                <label>RWA Amount (wei)</label>
                <input type="text" id="assetAmount" value="0x4563918244f3ffff">
            </div>
            <div class="form-group">
                <label>Lock Duration (seconds)</label>
                <select id="lockDuration">
                    <option value="60">60 sec</option>
                    <option value="300" selected>300 sec</option>
                    <option value="600">600 sec</option>
                </select>
            </div>
            <button type="submit" class="action-button" id="launchButton" disabled>🚀 Launch</button>
        </form>

        <div id="statusMessage" class="status-message">⏳ Connect wallet first</div>
        <div class="footer">Testnet only · MWA</div>
    </div>

    <!-- Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.16.0/ethers.min.js">
    </script>

    <script>
        console.log('Script started');
        console.log('typeof ethers:', typeof ethers);

        // Проверяем загрузку ethers
        if (typeof ethers === 'undefined') {
            document.getElementById('statusMessage').textContent = '❌ Ethers not loaded. Please refresh.';
            document.getElementById('statusMessage').className = 'status-message error';
        }

        // Ждем загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');

            const connectBtn = document.getElementById('connectButton');
            const walletStatus = document.getElementById('walletStatus');
            const statusMsg = document.getElementById('statusMessage');
            const launchBtn = document.getElementById('launchButton');
            const launchForm = document.getElementById('launchForm');

            const tokenName = document.getElementById('tokenName');
            const tokenSymbol = document.getElementById('tokenSymbol');
            const tokenSupply = document.getElementById('tokenSupply');
            const assetAmount = document.getElementById('assetAmount');
            const lockDuration = document.getElementById('lockDuration');

            let signer = null;
            let userAddress = null;
            let isConnected = false;

            function setStatus(text, type = 'info') {
                statusMsg.textContent = text;
                statusMsg.className = 'status-message';
                if (type === 'error') statusMsg.classList.add('error');
                else if (type === 'success') statusMsg.classList.add('success');
            }

            function updateUI() {
                launchBtn.disabled = !isConnected;
                if (isConnected) {
                    walletStatus.textContent = '🔗 ' + userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
                    connectBtn.textContent = 'Connected ✓';
                    connectBtn.classList.add('connected');
                } else {
                    walletStatus.textContent = '⛓️ Not connected';
                    connectBtn.textContent = 'Connect MetaMask';
                    connectBtn.classList.remove('connected');
                }
            }

            // ---- Подключение к MetaMask ----
            async function connectWallet() {
                console.log('connectWallet called');

                if (typeof window.ethereum === 'undefined') {
                    setStatus('❌ MetaMask not installed', 'error');
                    return;
                }

                try {
                    setStatus('⏳ Connecting...', 'info');
                    console.log('Requesting accounts...');

                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    console.log('Accounts:', accounts);

                    if (!accounts || accounts.length === 0) {
                        setStatus('❌ No accounts found', 'error');
                        return;
                    }

                    userAddress = accounts[0];
                    console.log('User address:', userAddress);

                    const provider = new ethers.BrowserProvider(window.ethereum);
                    signer = await provider.getSigner();
                    console.log('Signer obtained');

                    const network = await provider.getNetwork();
                    const chainId = Number(network.chainId);
                    console.log('Chain ID:', chainId);

                    if (chainId !== 46630) {
                        setStatus('⚠️ Please switch to Robinhood Testnet (Chain ID: 46630)', 'error');
                        try {
                            await window.ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: '0xb5fe' }]
                            });
                            setStatus('✅ Switched to Robinhood Testnet', 'success');
                        } catch (e) {
                            setStatus('❌ Please switch to Robinhood Testnet manually', 'error');
                            return;
                        }
                    }

                    isConnected = true;
                    setStatus('✅ Connected: ' + userAddress.slice(0, 6) + '...' + userAddress.slice(-4), 'success');
                    updateUI();

                    // Слушаем изменения аккаунта
                    window.ethereum.on('accountsChanged', function(accounts) {
                        console.log('accountsChanged:', accounts);
                        if (accounts && accounts.length > 0) {
                            userAddress = accounts[0];
                            isConnected = true;
                            updateUI();
                            setStatus('✅ Account changed: ' + userAddress.slice(0, 6) + '...' + userAddress.slice(-4),
                            'success');
                        } else {
                            isConnected = false;
                            userAddress = null;
                            updateUI();
                            setStatus('⛓️ Wallet disconnected', 'info');
                        }
                    });

                } catch (error) {
                    console.error('Connection error:', error);
                    setStatus('❌ Connection failed: ' + (error.message || 'Unknown error'), 'error');
                    isConnected = false;
                    userAddress = null;
                    updateUI();
                }
            }

            connectBtn.addEventListener('click', connectWallet);

            // ---- Запуск токена ----
            launchForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                if (!isConnected) {
                    setStatus('❌ Please connect wallet first', 'error');
                    return;
                }

                const name = tokenName.value.trim();
                const symbol = tokenSymbol.value.trim();
                const supply = parseInt(tokenSupply.value);
                const assetAmt = assetAmount.value.trim();
                const duration = parseInt(lockDuration.value);

                if (!name || !symbol || !supply || !assetAmt) {
                    setStatus('❌ Please fill all fields', 'error');
                    return;
                }

                setStatus('⏳ Launching token...', 'info');
                launchBtn.disabled = true;

                try {
                    // Здесь будет вызов контракта
                    // Пока просто имитация
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    setStatus('✅ Token launched! (simulated)', 'success');
                } catch (error) {
                    setStatus('❌ Error: ' + error.message, 'error');
                } finally {
                    launchBtn.disabled = false;
                }
            });

            // ---- Автоподключение ----
            if (typeof window.ethereum !== 'undefined') {
                window.ethereum.request({ method: 'eth_accounts' })
                    .then(accounts => {
                        if (accounts && accounts.length > 0) {
                            console.log('Auto-connecting...');
                            setTimeout(connectWallet, 500);
                        }
                    })
                    .catch(() => {});
            }

            updateUI();
            console.log('App initialized');
        });
    </script>

</body>
</html>
