<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWA — Launch Meme Token</title>
    <!-- Подключение шрифта "Courier New" как на печатной машинке -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #ffffff;
            color: #222222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 30px 25px;
            border: 2px solid #222222;
            background-color: #ffffff;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            border-bottom: 2px solid #222222;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .wallet-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #cccccc;
            margin-bottom: 30px;
        }

        .wallet-status {
            font-size: 14px;
            color: #555555;
        }

        #connectButton {
            font-family: 'Courier New', Courier, monospace;
            background: #222222;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #connectButton:hover {
            background: #444444;
        }

        #connectButton.connected {
            background: #2a7d4f;
        }

        #connectButton.connected:hover {
            background: #1f5f3b;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input, select {
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #888888;
            background: #fafafa;
            transition: border 0.2s, background 0.2s;
            border-radius: 0;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #222222;
            background: #ffffff;
        }

        input::placeholder {
            color: #aaaaaa;
        }

        .hint {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #666666;
        }

        .launch-fee {
            background: #f0f0f0;
            padding: 12px 15px;
            font-size: 15px;
            border-left: 4px solid #222222;
            margin: 20px 0 25px 0;
        }

        #launchButton {
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            background: #222222;
            color: #ffffff;
            border: none;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            letter-spacing: 1px;
        }

        #launchButton:hover:not(:disabled) {
            background: #000000;
        }

        #launchButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            background: #f4f4f4;
            font-size: 14px;
            border-left: 4px solid #888888;
            min-height: 50px;
            word-break: break-word;
        }

        .status-message.error {
            border-left-color: #c0392b;
            background: #fdf0ed;
        }

        .status-message.success {
            border-left-color: #2a7d4f;
            background: #edf7f2;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888888;
            text-align: center;
            border-top: 1px solid #dddddd;
            padding-top: 20px;
        }

        a {
            color: #222222;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        a:hover {
            color: #000000;
        }

        /* Для чекбоксов и радио, если понадобятся — добавим базовый стиль */
        select {
            appearance: auto;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⌨️ MWA · LAUNCH</h1>

    <!-- Подключение кошелька -->
    <div class="wallet-section">
        <span class="wallet-status" id="walletStatus">⛓️ Not connected</span>
        <button id="connectButton">Connect MetaMask</button>
    </div>

    <!-- Форма создания мем-токена -->
    <form id="launchForm" autocomplete="off">
        <div class="form-group">
            <label for="tokenName">Token Name</label>
            <input type="text" id="tokenName" placeholder="e.g. My Meme Token" maxlength="60" required>
        </div>

        <div class="form-group">
            <label for="tokenSymbol">Token Symbol</label>
            <input type="text" id="tokenSymbol" placeholder="e.g. MEME" maxlength="20" required>
        </div>

        <div class="form-group">
            <label for="totalSupply">Total Supply</label>
            <input type="number" id="totalSupply" placeholder="e.g. 1000000" min="1" step="1" required>
            <span class="hint">Number of tokens to mint.</span>
        </div>

        <div class="form-group">
            <label for="lockDuration">Lock / Redemption Period (seconds)</label>
            <select id="lockDuration" required>
                <option value="60">60 sec</option>
                <option value="120">120 sec</option>
                <option value="180">180 sec</option>
                <option value="300" selected>300 sec</option>
                <option value="600">600 sec</option>
            </select>
            <span class="hint">Time until you must buy back the tokens (60–600 sec).</span>
        </div>

        <div class="launch-fee">
            ⚡ Launch fee: <strong>0.0005 ETH</strong> (testnet)
        </div>

        <button type="submit" id="launchButton" disabled>Launch Token</button>
    </form>

    <div id="statusMessage" class="status-message">⏳ Awaiting connection and form input...</div>
    <div class="footer">
        <a href="#" target="_blank">Testnet only</a> · MWA protocol · ⚙️ v0.1
    </div>
</div>

<script type="text/javascript">
    (function() {
        // Элементы DOM
        const connectBtn = document.getElementById('connectButton');
        const walletStatus = document.getElementById('walletStatus');
        const launchBtn = document.getElementById('launchButton');
        const statusMsg = document.getElementById('statusMessage');
        const launchForm = document.getElementById('launchForm');

        // Поля формы
        const tokenName = document.getElementById('tokenName');
        const tokenSymbol = document.getElementById('tokenSymbol');
        const totalSupply = document.getElementById('totalSupply');
        const lockDuration = document.getElementById('lockDuration');

        // Состояние
        let userAddress = null;
        let isConnected = false;

        // ---- Вспомогательные функции ----
        function setStatus(text, type = 'info') {
            statusMsg.textContent = text;
            statusMsg.className = 'status-message';
            if (type === 'error') statusMsg.classList.add('error');
            else if (type === 'success') statusMsg.classList.add('success');
        }

        function updateLaunchButton() {
            // Доступен только если кошелек подключен и все поля заполнены
            if (!isConnected) {
                launchBtn.disabled = true;
                return;
            }
            const name = tokenName.value.trim();
            const symbol = tokenSymbol.value.trim();
            const supply = totalSupply.value.trim();
            if (name.length > 0 && symbol.length > 0 && supply.length > 0 && parseInt(supply) > 0) {
                launchBtn.disabled = false;
            } else {
                launchBtn.disabled = true;
            }
        }

        // ---- Подключение к MetaMask (Robinhood Testnet) ----
        async function connectWallet() {
            // Проверяем наличие MetaMask
            if (typeof window.ethereum === 'undefined') {
                setStatus('❌ MetaMask not detected. Please install it.', 'error');
                return;
            }

            try {
                setStatus('⏳ Connecting...', 'info');

                // Запрашиваем аккаунты
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                if (accounts.length === 0) {
                    setStatus('❌ No accounts found.', 'error');
                    return;
                }

                const address = accounts[0];
                userAddress = address;
                isConnected = true;

                // Обновляем UI
                walletStatus.textContent = `🔗 ${address.slice(0, 6)}...${address.slice(-4)}`;
                connectBtn.textContent = 'Connected ✓';
                connectBtn.classList.add('connected');
                setStatus(`✅ Connected: ${address}`, 'success');

                // Проверяем сеть (Robinhood Testnet = chainId 46630)
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId !== '0xb5fe') { // 46630 в hex
                    setStatus('⚠️ Please switch to Robinhood Testnet (Chain ID: 46630).', 'error');
                    // Предложим переключить сеть
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0xb5fe' }],
                        });
                        setStatus('✅ Switched to Robinhood Testnet.', 'success');
                    } catch (switchError) {
                        // Если сеть не добавлена, предложим добавить
                        if (switchError.code === 4902) {
                            try {
                                await window.ethereum.request({
                                    method: 'wallet_addEthereumChain',
                                    params: [{
                                        chainId: '0xb5fe',
                                        chainName: 'Robinhood Testnet',
                                        rpcUrls: ['https://rpc.testnet.chain.robinhood.com'],
                                        nativeCurrency: {
                                            name: 'ETH',
                                            symbol: 'ETH',
                                            decimals: 18
                                        },
                                        blockExplorerUrls: ['https://explorer.testnet.chain.robinhood.com']
                                    }]
                                });
                                setStatus('✅ Robinhood Testnet added. Please reconnect.', 'success');
                            } catch (addError) {
                                setStatus('❌ Failed to add Robinhood Testnet. Please add manually.', 'error');
                            }
                        } else {
                            setStatus('❌ Failed to switch network. Please switch manually.', 'error');
                        }
                    }
                } else {
                    setStatus(`✅ Connected to Robinhood Testnet. Address: ${address}`, 'success');
                }

                updateLaunchButton();

            } catch (error) {
                console.error('Connection error:', error);
                setStatus(`❌ Connection failed: ${error.message || 'Unknown error'}`, 'error');
                isConnected = false;
                userAddress = null;
                connectBtn.textContent = 'Connect MetaMask';
                connectBtn.classList.remove('connected');
                walletStatus.textContent = '⛓️ Not connected';
                updateLaunchButton();
            }
        }

        // Обработчик кнопки Connect
        connectBtn.addEventListener('click', connectWallet);

        // ---- Обработчики формы для проверки заполнения ----
        [tokenName, tokenSymbol, totalSupply].forEach(el => {
            el.addEventListener('input', updateLaunchButton);
        });
        lockDuration.addEventListener('change', updateLaunchButton);

        // ---- Запуск (Launch) ----
        launchForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            if (!isConnected || !userAddress) {
                setStatus('❌ Please connect your wallet first.', 'error');
                return;
            }

            // Собираем данные
            const name = tokenName.value.trim();
            const symbol = tokenSymbol.value.trim();
            const supply = totalSupply.value.trim();
            const duration = parseInt(lockDuration.value);

            if (!name || !symbol || !supply || isNaN(duration)) {
                setStatus('❌ Please fill all fields correctly.', 'error');
                return;
            }

            const supplyNum = parseInt(supply);
            if (supplyNum <= 0) {
                setStatus('❌ Total supply must be greater than 0.', 'error');
                return;
            }

            if (duration < 60 || duration > 600) {
                setStatus('❌ Lock period must be between 60 and 600 seconds.', 'error');
                return;
            }

            // Здесь будет логика создания токена (заглушка)
            setStatus(`⏳ Launching token "${name}" (${symbol}) with supply ${supplyNum}, lock ${duration}s...`, 'info');

            // Эмуляция транзакции
            try {
                // Здесь нужно вставить реальный вызов смарт-контракта
                // Пример эмуляции (уберите в продакшене):
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Имитация успеха
                setStatus(`✅ Token "${name}" launched successfully! TX: 0x123...abc (simulated)`, 'success');

                // (Опционально) сбросить форму
                // launchForm.reset();
                // updateLaunchButton();

            } catch (err) {
                console.error('Launch error:', err);
                setStatus(`❌ Launch failed: ${err.message || 'Unknown error'}`, 'error');
            }
        });

        // ---- Инициализация ----
        updateLaunchButton();

        // Проверяем, был ли уже подключен кошелек (MetaMask может восстановить сессию)
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.request({ method: 'eth_accounts' })
                .then(accounts => {
                    if (accounts && accounts.length > 0) {
                        // Автоматически подключаемся, если уже есть аккаунты
                        // Не вызываем connectWallet() автоматически, т.к. это может быть нежелательно
                        // Показываем статус, но пользователь должен нажать кнопку сам.
                        walletStatus.textContent = `⛓️ ${accounts[0].slice(0,6)}...${accounts[0].slice(-4)} (inactive)`;
                        connectBtn.textContent = 'Re-connect';
                        // Можно активировать кнопку после ручного подтверждения
                    }
                })
                .catch(() => {});
        }

        // Обработка изменения аккаунта/сети в MetaMask
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length > 0) {
                    // Переподключение
                    connectWallet();
                } else {
                    // Кошелек отключили
                    isConnected = false;
                    userAddress = null;
                    walletStatus.textContent = '⛓️ Not connected';
                    connectBtn.textContent = 'Connect MetaMask';
                    connectBtn.classList.remove('connected');
                    setStatus('⛓️ Wallet disconnected.', 'info');
                    updateLaunchButton();
                }
            });

            window.ethereum.on('chainChanged', () => {
                // При смене сети перепроверяем состояние
                if (isConnected) {
                    connectWallet();
                }
            });
        }

    })();
</script>

</body>
</html>
