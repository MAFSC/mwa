<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWA • Launch & Trade</title>
    <script src="./ethers.umd.min.js"></script>
    <style>
        :root {
            --bg: #081411;
            --panel: #10201c;
            --panel2: #132720;
            --green: #00d395;
            --green2: #00b67d;
            --text: #ffffff;
            --text2: #cfd8d6;
            --red: #ff5555;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: Inter, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .section {
            margin-top: 28px;
            padding: 24px;
            background: var(--panel2);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .wallet {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 16px;
            background: #0d1b18;
            border-radius: 12px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .wallet-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .wallet-address {
            font-size: 14px;
            color: var(--text2);
        }

        button {
            background: var(--green);
            color: black;
            border: none;
            padding: 13px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.2s;
        }

        button:hover:not(:disabled) {
            background: var(--green2);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        button.small {
            padding: 6px 14px;
            font-size: 13px;
            margin-left: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #081411;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #9cb4ad;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            background: #081411;
            border-left: 4px solid var(--green);
            border-radius: 8px;
            word-break: break-word;
        }

        .status.error {
            border-left-color: var(--red);
        }

        .status.success {
            border-left-color: var(--green);
        }

        .status.pending {
            border-left-color: #f39c12;
        }

        .ticker {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .card {
            background: #081411;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
        }

        .symbol {
            font-size: 13px;
            opacity: 0.6;
            margin-bottom: 10px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            opacity: 0.4;
            font-size: 12px;
        }

        #tokenList {
            margin-top: 10px;
        }

        .token-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #081411;
            border-radius: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .token-item .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .token-item .info .name {
            font-weight: 600;
        }

        .token-item .info .address {
            font-size: 12px;
            color: #9cb4ad;
        }

        .token-item .info .deposit-id {
            font-size: 11px;
            color: #9cb4ad;
        }

        .token-item .balance-info {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .token-item .balance-info .balance {
            color: #00d395;
        }

        .token-item .balance-info .supply {
            font-size: 12px;
            color: #9cb4ad;
        }

        .token-item .balance-info .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0, 211, 149, 0.15);
            color: #00d395;
        }

        .token-item .balance-info .status-badge.redeemed {
            background: rgba(255, 85, 85, 0.15);
            color: #ff5555;
        }

        .token-item .actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }

        .buy-sell-input {
            width: 70px;
            padding: 4px 8px;
            font-size: 13px;
            background: #081411;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            border-radius: 4px;
        }

        .btn-buy {
            background: #00d395;
            color: #000;
        }

        .btn-buy:hover {
            background: #00b67d;
        }

        .btn-sell {
            background: #ff5555;
            color: #fff;
        }

        .btn-sell:hover {
            background: #cc4444;
        }

        .btn-approve {
            background: #f39c12;
            color: #000;
        }

        .btn-approve:hover {
            background: #d68910;
        }

        #launchStatus {
            margin-top: 12px;
            font-size: 14px;
            color: var(--green);
            display: none;
        }

        .deposit-info {
            font-size: 12px;
            color: #9cb4ad;
            margin-top: 4px;
        }

        .eth-amount {
            font-size: 13px;
            color: #9cb4ad;
            margin-top: 4px;
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .ticker {
                grid-template-columns: repeat(2, 1fr);
            }
            .wallet {
                flex-direction: column;
                align-items: stretch;
            }
            .token-item {
                flex-direction: column;
                align-items: stretch;
            }
            .token-item .balance-info {
                align-items: flex-start;
            }
            .token-item .actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MWA • Launch & Trade</h1>

        <!-- Wallet -->
        <div class="wallet">
            <div class="wallet-info">
                <div id="walletState">Wallet not connected</div>
                <div class="wallet-address" id="walletAddress">—</div>
            </div>
            <button id="connectBtn">Connect MetaMask</button>
        </div>

        <!-- Ticker -->
        <div class="ticker">
            <div class="card"><div class="symbol">AAPL</div><div class="price" id="AAPL">--</div></div>
            <div class="card"><div class="symbol">TSLA</div><div class="price" id="TSLA">--</div></div>
            <div class="card"><div class="symbol">NVDA</div><div class="price" id="NVDA">--</div></div>
            <div class="card"><div class="symbol">AMD</div><div class="price" id="AMD">--</div></div>
        </div>

        <!-- Launch Token -->
        <div class="section">
            <h2>📦 Launch New Token</h2>
            <div class="grid">
                <div>
                    <label>Token Name</label>
                    <input id="tokenName" placeholder="Token name" value="My Meme" maxlength="60">
                </div>
                <div>
                    <label>Token Symbol</label>
                    <input id="tokenSymbol" placeholder="Symbol" value="MEME" maxlength="20">
                </div>
                <div>
                    <label>Token Supply</label>
                    <input id="tokenSupply" type="number" value="1000000">
                </div>
                <div>
                    <label>RWA Asset</label>
                    <select id="assetSelect">
                        <option value="0xC9f9c86933092BbbfFF3CCb4b105A4A94bf3Bd4E">AMD</option>
                        <option value="0x71178BAc73cBeb415514eB542a8995b82669778d">TSLA</option>
                        <option value="0x7dF7F09271136b49bD1E44937FA758264024858C">AAPL</option>
                    </select>
                </div>
                <div>
                    <label>Asset Amount (wei)</label>
                    <input id="assetAmount" value="1000000000000000000">
                </div>
                <div>
                    <label>Lock Duration (seconds)</label>
                    <input id="lockDuration" type="number" value="600" min="60">
                </div>
            </div>
            <div class="eth-amount">⚡ ETH needed for liquidity: <span id="ethNeeded">0.01</span> ETH</div>
            <button style="margin-top:20px;width:100%;" id="depositBtn" disabled>🚀 Launch Token</button>
            <div id="launchStatus"></div>
        </div>

        <!-- Token List -->
        <div class="section">
            <h2>📊 Your Tokens</h2>
            <div id="tokenList">
                <div style="color: #9cb4ad; padding: 20px; text-align: center;">Loading tokens from blockchain...</div>
            </div>
        </div>

        <!-- Redeem -->
        <div class="section">
            <h2>🔄 Redeem RWA</h2>
            <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;">
                <div>
                    <label>Deposit ID</label>
                    <input id="depositId" value="1">
                </div>
                <button id="redeemBtn" disabled style="margin-bottom:2px;">Redeem</button>
            </div>
            <div style="margin-top:8px;font-size:12px;color:#9cb4ad;">
                ⚠️ Only the token creator (owner) can redeem RWA assets.
            </div>
        </div>

        <div class="status" id="status">Ready.</div>
        <div class="footer">MWA Protocol v3 — Router</div>
    </div>

    <script>
        "use strict";

        // =========================================================
        // CONFIG
        // =========================================================
        const CONFIG = {
            CHAIN_ID: 46630,
            CHAIN_HEX: "0xb626",
            CHAIN_NAME: "Robinhood Testnet",
            RPC_URL: "https://rpc.testnet.chain.robinhood.com",
            EXPLORER: "https://explorer.testnet.chain.robinhood.com",
            ROUTER_ADDRESS: "0x0e5b59459F8F0315E4eF513bF64BD154EE3A2B6A"
        };

        // =========================================================
        // DOM
        // =========================================================
        const connectBtn = document.getElementById("connectBtn");
        const walletState = document.getElementById("walletState");
        const walletAddress = document.getElementById("walletAddress");
        const status = document.getElementById("status");
        const depositBtn = document.getElementById("depositBtn");
        const redeemBtn = document.getElementById("redeemBtn");
        const tokenName = document.getElementById("tokenName");
        const tokenSymbol = document.getElementById("tokenSymbol");
        const tokenSupply = document.getElementById("tokenSupply");
        const assetSelect = document.getElementById("assetSelect");
        const assetAmount = document.getElementById("assetAmount");
        const lockDuration = document.getElementById("lockDuration");
        const depositId = document.getElementById("depositId");
        const tokenList = document.getElementById("tokenList");
        const launchStatus = document.getElementById("launchStatus");
        const ethNeeded = document.getElementById("ethNeeded");

        // =========================================================
        // ROUTER ABI
        // =========================================================
        const ROUTER_ABI = [
            "function launch(string,string,uint256,address,uint256,uint256) payable",
            "function buy(address,uint256) payable",
            "function sell(address,uint256,uint256)",
            "function redeem(uint256)",
            "function getDeposit(uint256) view returns(tuple(address assetAddress, uint256 assetAmount, address memeToken, uint256 memeTokenAmount, uint256 redemptionDeadline, bool isRedeemed, bool isClaimed))",
            "function getActiveTokens() view returns(address[])",
            "function getReserves(address) view returns(uint256,uint256)",
            "function getPrice(address) view returns(uint256)",
            "function depositCounter() view returns(uint256)",
            "function tokenInfoMap(address) view returns(address tokenAddress, string name, string symbol, uint256 totalSupply, uint256 reserveETH, uint256 reserveTokens, uint256 price, uint256 lastUpdate, bool isActive)"
        ];

        // =========================================================
        // TOKEN ABI
        // =========================================================
        const TOKEN_ABI = [
            "function balanceOf(address) view returns(uint256)",
            "function name() view returns(string)",
            "function symbol() view returns(string)",
            "function approve(address,uint256) returns(bool)",
            "function allowance(address,address) view returns(uint256)"
        ];

        // =========================================================
        // PRICES
        // =========================================================
        const PRICE_CONFIG = {
            UPDATE_INTERVAL: 15000,
            API_URL: "https://requests-awareness-chair-lodge.trycloudflare.com/api/quotes",
            SYMBOLS: ["AAPL", "TSLA", "NVDA", "AMD"]
        };

        // =========================================================
        // APP STATE
        // =========================================================
        const APP = {
            provider: null,
            signer: null,
            account: null,
            router: null,
            connected: false,
            eventsAdded: false,
            deposits: [],
            tokenCache: new Map()
        };

        // =========================================================
        // HELPERS
        // =========================================================
        function setStatus(text, type = "success") {
            status.innerText = text;
            status.className = "status";
            if (type === "error") status.classList.add("error");
            if (type === "success") status.classList.add("success");
            if (type === "pending") status.classList.add("pending");
        }

        function shortAddress(addr) {
            if (!addr || addr === "0x0000000000000000000000000000000000000000") return "—";
            return addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
        }

        function formatPrice(price) {
            return "$" + Number(price).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function parseBigInt(value) {
            try {
                if (value.startsWith("0x")) return BigInt(value);
                return BigInt(value);
            } catch {
                return null;
            }
        }

        function isZeroAddress(addr) {
            return !addr || addr === "0x0000000000000000000000000000000000000000";
        }

        function disableButtons(flag) {
            depositBtn.disabled = flag;
            redeemBtn.disabled = flag;
        }

        // =========================================================
        // TOKEN CACHE
        // =========================================================
        async function getTokenInfo(tokenAddress) {
            if (APP.tokenCache.has(tokenAddress)) {
                return APP.tokenCache.get(tokenAddress);
            }

            try {
                const token = new ethers.Contract(tokenAddress, TOKEN_ABI, APP.signer);
                const name = await token.name();
                const symbol = await token.symbol();
                const info = { name, symbol, contract: token };
                APP.tokenCache.set(tokenAddress, info);
                return info;
            } catch (e) {
                console.warn("Could not load token info for", tokenAddress, e);
                return null;
            }
        }

        async function getTokenBalance(tokenAddress) {
            if (!APP.connected || !APP.signer) return 0;
            try {
                const token = new ethers.Contract(tokenAddress, TOKEN_ABI, APP.signer);
                const balance = await token.balanceOf(APP.account);
                return Number(balance);
            } catch (e) {
                return 0;
            }
        }

        // =========================================================
        // LOAD DEPOSITS FROM BLOCKCHAIN
        // =========================================================
        async function loadDeposits() {
            if (!APP.connected || !APP.router) return [];

            try {
                const counter = Number(await APP.router.depositCounter());
                console.log("Total deposits:", counter);

                const deposits = [];

                for (let i = 1; i <= counter; i++) {
                    try {
                        const deposit = await APP.router.getDeposit(i);
                        const memeToken = deposit.memeToken;

                        if (!isZeroAddress(memeToken)) {
                            deposits.push({
                                id: i,
                                assetAddress: deposit.assetAddress,
                                assetAmount: Number(deposit.assetAmount),
                                memeToken: memeToken,
                                memeTokenAmount: Number(deposit.memeTokenAmount),
                                redemptionDeadline: Number(deposit.redemptionDeadline),
                                isRedeemed: deposit.isRedeemed,
                                isClaimed: deposit.isClaimed
                            });
                        }
                    } catch (e) {
                        console.warn("Could not load deposit", i, e);
                    }
                }

                APP.deposits = deposits;
                return deposits;

            } catch (e) {
                console.error("Error loading deposits:", e);
                return [];
            }
        }

        // =========================================================
        // RENDER TOKEN LIST
        // =========================================================
        async function renderTokenList() {
            if (!APP.connected) {
                tokenList.innerHTML =
                '<div style="color: #9cb4ad; padding: 20px; text-align: center;">Connect wallet to see your tokens.</div>';
                return;
            }

            const deposits = await loadDeposits();

            if (deposits.length === 0) {
                tokenList.innerHTML =
                    '<div style="color: #9cb4ad; padding: 20px; text-align: center;">No tokens found. Launch your first token!</div>';
                return;
            }

            let html = '';

            for (const deposit of deposits) {
                if (isZeroAddress(deposit.memeToken)) continue;

                const tokenInfo = await getTokenInfo(deposit.memeToken);
                if (!tokenInfo) continue;

                const balance = await getTokenBalance(deposit.memeToken);
                const totalSupply = deposit.memeTokenAmount;

                const isRedeemed = deposit.isRedeemed;
                const isExpired = Date.now() / 1000 > deposit.redemptionDeadline;

                const statusText = isRedeemed ? '✅ Redeemed' :
                    isExpired ? '⏳ Expired' :
                    '🟢 Active';

                const statusClass = isRedeemed ? 'redeemed' :
                    isExpired ? 'redeemed' : '';

                html += `
                        <div class="token-item" id="token-${deposit.id}">
                            <div class="info">
                                <div class="name">${tokenInfo.name} (${tokenInfo.symbol})</div>
                                <div class="address">${shortAddress(deposit.memeToken)}</div>
                                <div class="deposit-id">Deposit ID: ${deposit.id}</div>
                                <div class="deposit-id">Locked until: ${new Date(deposit.redemptionDeadline * 1000).toLocaleString()}</div>
                            </div>
                            <div class="balance-info">
                                <div class="balance">Balance: ${balance.toLocaleString()}</div>
                                <div class="supply">Total supply: ${totalSupply.toLocaleString()}</div>
                                <div class="status-badge ${statusClass}">${statusText}</div>
                            </div>
                            <div class="actions">
                                <input type="number" class="buy-sell-input" id="amount_${deposit.id}" value="1" min="1">
                                <button class="small btn-buy" data-token="${deposit.memeToken}" data-id="${deposit.id}">Buy</button>
                                <button class="small btn-sell" data-token="${deposit.memeToken}" data-id="${deposit.id}">Sell</button>
                                <button class="small btn-approve" data-token="${deposit.memeToken}" data-id="${deposit.id}">Approve</button>
                            </div>
                        </div>
                    `;
            }

            if (html === '') {
                tokenList.innerHTML =
                    '<div style="color: #9cb4ad; padding: 20px; text-align: center;">No active tokens found. Launch your first token!</div>';
                return;
            }

            tokenList.innerHTML = html;

            // Bind event handlers
            document.querySelectorAll('.btn-buy').forEach(btn => {
                btn.onclick = function() {
                    const token = this.dataset.token;
                    const id = this.dataset.id;
                    buyToken(token, id);
                };
            });

            document.querySelectorAll('.btn-sell').forEach(btn => {
                btn.onclick = function() {
                    const token = this.dataset.token;
                    const id = this.dataset.id;
                    sellToken(token, id);
                };
            });

            document.querySelectorAll('.btn-approve').forEach(btn => {
                btn.onclick = function() {
                    const token = this.dataset.token;
                    approveToken(token);
                };
            });
        }

        // =========================================================
        // APPROVE TOKEN
        // =========================================================
        async function approveToken(tokenAddress) {
            if (!APP.connected) {
                setStatus("Connect wallet first.", "error");
                return;
            }

            try {
                setStatus(`Approving ${shortAddress(tokenAddress)}...`, "pending");

                const token = new ethers.Contract(tokenAddress, TOKEN_ABI, APP.signer);
                const tx = await token.approve(CONFIG.ROUTER_ADDRESS, ethers.MaxUint256);
                await tx.wait();

                setStatus(`✅ Token approved for trading!`, "success");
            } catch (e) {
                console.error(e);
                setStatus(`❌ Approval failed: ${e.message}`, "error");
            }
        }

        // =========================================================
        // BUY TOKEN
        // =========================================================
        async function buyToken(tokenAddress, depositId) {
            if (!APP.connected) {
                setStatus("Connect wallet first.", "error");
                return;
            }

            const amountInput = document.getElementById(`amount_${depositId}`);
            const amount = parseInt(amountInput.value) || 1;

            if (amount <= 0) {
                setStatus("❌ Amount must be > 0", "error");
                return;
            }

            try {
                setStatus(`Buying ${amount} tokens...`, "pending");

                // Get reserves to calculate price
                const reserves = await APP.router.getReserves(tokenAddress);
                const price = reserves[0] / reserves[1];

                // Calculate ETH needed
                const ethNeeded = (amount / reserves[1]) * reserves[0];

                // Buy with slippage protection
                const minAmountOut = Math.floor(amount * 0.95);
                const ethValue = ethers.parseEther((ethNeeded * 1.01).toString());

                const tx = await APP.router.buy(tokenAddress, minAmountOut, {
                    value: ethValue
                });
                await tx.wait();

                setStatus(`✅ Bought ${amount} tokens!`, "success");
                await renderTokenList();

            } catch (e) {
                console.error(e);
                setStatus(`❌ Buy failed: ${e.message}`, "error");
            }
        }

        // =========================================================
        // SELL TOKEN
        // =========================================================
        async function sellToken(tokenAddress, depositId) {
            if (!APP.connected) {
                setStatus("Connect wallet first.", "error");
                return;
            }

            const amountInput = document.getElementById(`amount_${depositId}`);
            const amount = parseInt(amountInput.value) || 1;

            if (amount <= 0) {
                setStatus("❌ Amount must be > 0", "error");
                return;
            }

            try {
                setStatus(`Selling ${amount} tokens...`, "pending");

                // Check allowance
                const token = new ethers.Contract(tokenAddress, TOKEN_ABI, APP.signer);
                const allowance = await token.allowance(APP.account, CONFIG.ROUTER_ADDRESS);

                if (Number(allowance) < amount) {
                    setStatus("⚠️ Please approve tokens first", "error");
                    return;
                }

                // Sell with slippage protection
                const reserves = await APP.router.getReserves(tokenAddress);
                const minEthOut = Math.floor((amount / reserves[1]) * reserves[0] * 0.95);

                const tx = await APP.router.sell(tokenAddress, amount, minEthOut);
                await tx.wait();

                setStatus(`✅ Sold ${amount} tokens!`, "success");
                await renderTokenList();

            } catch (e) {
                console.error(e);
                setStatus(`❌ Sell failed: ${e.message}`, "error");
            }
        }

        // =========================================================
        // WALLET UI
        // =========================================================
        function updateWalletUI() {
            if (APP.connected) {
                walletState.innerHTML = "Wallet Connected";
                walletAddress.innerHTML = shortAddress(APP.account);
                connectBtn.innerHTML = "Connected";
                checkFormValidity();
            } else {
                walletState.innerHTML = "Wallet not connected";
                walletAddress.innerHTML = "—";
                connectBtn.innerHTML = "Connect MetaMask";
                depositBtn.disabled = true;
                redeemBtn.disabled = true;
            }
        }

        function checkFormValidity() {
            if (!APP.connected) {
                depositBtn.disabled = true;
                redeemBtn.disabled = true;
                return;
            }

            const name = tokenName.value.trim();
            const symbol = tokenSymbol.value.trim();
            const supply = tokenSupply.value.trim();
            const assetAddr = assetSelect.value.trim();
            const assetAmt = assetAmount.value.trim();

            const isValid = name && symbol && supply && parseInt(supply) > 0 && assetAddr && assetAmt;
            depositBtn.disabled = !isValid;
            redeemBtn.disabled = false;
        }

        // =========================================================
        // NETWORK
        // =========================================================
        async function ensureNetwork() {
            const chain = await APP.provider.getNetwork();
            if (Number(chain.chainId) !== CONFIG.CHAIN_ID) {
                try {
                    await window.ethereum.request({
                        method: "wallet_switchEthereumChain",
                        params: [{ chainId: CONFIG.CHAIN_HEX }]
                    });
                } catch (e) {
                    if (e.code === 4902) {
                        await window.ethereum.request({
                            method: "wallet_addEthereumChain",
                            params: [{
                                chainId: CONFIG.CHAIN_HEX,
                                chainName: CONFIG.CHAIN_NAME,
                                rpcUrls: [CONFIG.RPC_URL],
                                nativeCurrency: { name: "ETH", symbol: "ETH", decimals: 18 },
                                blockExplorerUrls: [CONFIG.EXPLORER]
                            }]
                        });
                    } else {
                        throw e;
                    }
                }
            }
        }

        // =========================================================
        // CONNECT WALLET
        // =========================================================
        async function connectWallet() {
            if (typeof window.ethereum === "undefined") {
                setStatus("MetaMask is not installed", "error");
                return;
            }
            connectBtn.disabled = true;
            connectBtn.innerHTML = "Connecting...";
            try {
                APP.provider = new ethers.BrowserProvider(window.ethereum);
                await ensureNetwork();
                const accounts = await APP.provider.send("eth_requestAccounts", []);
                APP.signer = await APP.provider.getSigner();
                APP.account = accounts[0];

                APP.router = new ethers.Contract(CONFIG.ROUTER_ADDRESS, ROUTER_ABI, APP.signer);

                APP.connected = true;
                updateWalletUI();
                setStatus("Wallet connected successfully.");

                // Load data
                await renderTokenList();

                // Get deposit counter
                try {
                    const counter = await APP.router.depositCounter();
                    depositId.value = Number(counter) + 1;
                } catch (e) {
                    console.log('Could not get deposit counter');
                }

            } catch (e) {
                console.error(e);
                APP.connected = false;
                updateWalletUI();
                setStatus(e.message, "error");
            }
            connectBtn.disabled = false;
        }

        // =========================================================
        // LAUNCH
        // =========================================================
        async function executeLaunch() {
            if (!APP.connected) {
                setStatus("Connect wallet first.", "error");
                return;
            }
            disableButtons(true);
            try {
                const name = tokenName.value.trim();
                const symbol = tokenSymbol.value.trim();
                const supply = BigInt(tokenSupply.value.trim());
                const rwaAddress = assetSelect.value.trim();
                const rwaAmount = parseBigInt(assetAmount.value.trim());
                const duration = Number(lockDuration.value);

                if (!name) throw new Error("Token name required.");
                if (!symbol) throw new Error("Token symbol required.");
                if (supply <= 0n) throw new Error("Supply must be positive.");
                if (!ethers.isAddress(rwaAddress)) throw new Error("Invalid asset address.");
                if (rwaAmount === null) throw new Error("Invalid amount.");
                if (duration < 60) throw new Error("Lock duration must be at least 60 seconds.");

                setStatus(`Launching ${name} (${symbol})...`, "pending");

                const ethAmount = ethers.parseEther("0.01");

                const tx = await APP.router.launch(
                    name,
                    symbol,
                    supply,
                    rwaAddress,
                    rwaAmount,
                    duration, {
                        value: ethAmount
                    }
                );

                setStatus("⏳ Waiting for confirmation...", "pending");
                const receipt = await tx.wait();

                if (receipt.status !== 1) throw new Error("Transaction failed.");

                // Get deposit ID
                const counter = await APP.router.depositCounter();
                depositId.value = counter.toString();

                // Clear cache and reload
                APP.tokenCache.clear();
                await renderTokenList();

                setStatus(`✅ ${name} (${symbol}) launched! Deposit ID: ${counter}`, "success");

            } catch (e) {
                console.error(e);
                setStatus(e.reason || e.shortMessage || e.message, "error");
            }
            disableButtons(false);
        }

        // =========================================================
        // REDEEM
        // =========================================================
        async function executeRedeem() {
            if (!APP.connected) {
                setStatus("Connect wallet first.", "error");
                return;
            }
            disableButtons(true);
            try {
                const id = Number(depositId.value);
                if (id <= 0) throw new Error("Invalid deposit id.");

                const deposit = await APP.router.getDeposit(id);

                if (isZeroAddress(deposit.memeToken)) {
                    throw new Error(`Deposit ID ${id} has no valid token.`);
                }

                if (deposit.isRedeemed) {
                    throw new Error(`Deposit ID ${id} is already redeemed.`);
                }

                const deadline = Number(deposit.redemptionDeadline);
                const now = Math.floor(Date.now() / 1000);
                if (deadline === 0 || now > deadline) {
                    throw new Error(`Deposit ID ${id} expired.`);
                }

                // Check token balance
                const balance = await getTokenBalance(deposit.memeToken);
                if (balance < Number(deposit.memeTokenAmount)) {
                    throw new Error(`Not enough tokens. Need ${Number(deposit.memeTokenAmount)}, have ${balance}`);
                }

                // Check allowance
                const token = new ethers.Contract(deposit.memeToken, TOKEN_ABI, APP.signer);
                const allowance = await token.allowance(APP.account, CONFIG.ROUTER_ADDRESS);
                if (Number(allowance) < Number(deposit.memeTokenAmount)) {
                    setStatus("⏳ Approving tokens for redeem...", "pending");
                    const approveTx = await token.approve(CONFIG.ROUTER_ADDRESS, ethers.MaxUint256);
                    await approveTx.wait();
                }

                setStatus(`⏳ Redeeming deposit ${id}...`, "pending");
                const tx = await APP.router.redeem(id);
                await tx.wait();

                // Clear cache and reload
                APP.tokenCache.clear();
                await renderTokenList();

                setStatus(`✅ Deposit ${id} redeemed successfully!`, "success");

            } catch (e) {
                console.error('Redeem error:', e);
                setStatus(`❌ ${e.message || 'Redeem failed'}`, "error");
            }
            disableButtons(false);
        }

        // =========================================================
        // PRICES
        // =========================================================
        async function refreshPrices() {
            try {
                const response = await fetch(PRICE_CONFIG.API_URL);
                if (!response.ok) throw new Error("HTTP " + response.status);
                const prices = await response.json();
                prices.forEach(item => {
                    const el = document.getElementById(item.symbol);
                    if (!el) return;
                    el.textContent = formatPrice(item.price);
                    el.style.color = item.change >= 0 ? "#00d395" : "#ff5555";
                });
            } catch (e) {
                console.error("Price error:", e);
            }
        }

        // =========================================================
        // EVENTS
        // =========================================================
        connectBtn.onclick = connectWallet;
        depositBtn.addEventListener("click", executeLaunch);
        redeemBtn.addEventListener("click", executeRedeem);

        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('input', checkFormValidity);
            el.addEventListener('change', checkFormValidity);
        });

        // Update ETH needed when supply changes
        tokenSupply.addEventListener('input', function() {
            const supply = parseInt(this.value) || 1000000;
            const eth = (supply / 100000000).toFixed(4);
            ethNeeded.textContent = eth;
        });

        // =========================================================
        // INIT
        // =========================================================
        function initWalletEvents() {
            if (APP.eventsAdded) return;
            APP.eventsAdded = true;
            window.ethereum.on("accountsChanged", async (accounts) => {
                if (accounts.length === 0) {
                    APP.connected = false;
                    updateWalletUI();
                    return;
                }
                await connectWallet();
            });
            window.ethereum.on("chainChanged", () => {
                window.location.reload();
            });
        }

        async function autoConnect() {
            if (typeof window.ethereum === "undefined") return;
            try {
                APP.provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await APP.provider.send("eth_accounts", []);
                if (accounts.length) {
                    await connectWallet();
                }
            } catch (e) {
                console.log(e);
            }
        }

        async function initializeApplication() {
            console.log("========================================");
            console.log("MWA Launch & Trade v3 — Router");
            console.log("Router:", CONFIG.ROUTER_ADDRESS);
            console.log("========================================");
            try {
                if (typeof window.ethereum === "undefined") {
                    setStatus("MetaMask not detected.", "error");
                    console.warn("MetaMask not installed.");
                    return;
                }
                APP.provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await APP.provider.send("eth_accounts", []);
                if (accounts.length) {
                    console.log("Found authorized wallet.");
                    await connectWallet();
                } else {
                    updateWalletUI();
                    setStatus("Click Connect MetaMask.", "success");
                }
                console.log("Application ready.");
            } catch (e) {
                console.error(e);
                setStatus(e.message, "error");
            }
        }

        initWalletEvents();
        autoConnect();
        initializeApplication();

        // Refresh every 15 seconds
        setInterval(async () => {
            if (APP.connected) {
                await renderTokenList();
            }
        }, 15000);

        setInterval(async () => {
            try { await refreshPrices(); } catch (e) { console.log(e); }
        }, 15000);

        document.addEventListener("visibilitychange", async () => {
            if (document.hidden) return;
            if (APP.connected) {
                APP.tokenCache.clear();
                await renderTokenList();
                await refreshPrices();
            }
        });

        console.log("MWA v3 initialized successfully");
        console.log("========================================");
    </script>

</body>
</html>
