<script>
    "use strict";

/*=========================================================
    MWA v2
    CONFIG
=========================================================*/

const CONFIG = {

    CHAIN_ID: 46630,

    CHAIN_HEX: "0xb626",

    CHAIN_NAME: "Robinhood Testnet",

    RPC_URL: "https://rpc.testnet.chain.robinhood.com",

    EXPLORER: "https://explorer.testnet.chain.robinhood.com",

    VAULT_ADDRESS:
        "0xdd6fc829709F47c6e9D764dc65B4324DF851fA40",

    TOKEN_ADDRESS:
        "0xdBB8401ee6c808c747578C680e6b65AEFBAc6484"

};


/*=========================================================
    DOM
=========================================================*/

const connectBtn=document.getElementById("connectBtn");

const walletState=document.getElementById("walletState");

const walletAddress=document.getElementById("walletAddress");

const balance=document.getElementById("balance");

const network=document.getElementById("network");

const status=document.getElementById("status");

const vaultAddress=document.getElementById("vaultAddress");

const tokenAddress=document.getElementById("tokenAddress");

vaultAddress.textContent=CONFIG.VAULT_ADDRESS;

tokenAddress.textContent=CONFIG.TOKEN_ADDRESS;


/*=========================================================
    APP STATE
=========================================================*/

const APP={

    provider:null,

    signer:null,

    account:null,

    vault:null,

    token:null,

    connected:false,

    eventsAdded:false

};


/*=========================================================
    ABI
=========================================================*/

const TOKEN_ABI=[

"function balanceOf(address owner)view returns(uint256)",

"function allowance(address owner,address spender)view returns(uint256)",

"function approve(address spender,uint256 amount)returns(bool)"

];


const VAULT_ABI=[

"function depositRWA(address,uint256,uint256,uint256)",

"function redeemRWA(uint256)",

"function depositCounter()view returns(uint256)"

];


/*=========================================================
    STATUS
=========================================================*/

function setStatus(message,type="success"){

    status.innerText=message;

    status.className="status";

    if(type==="error")
        status.classList.add("error");

    if(type==="success")
        status.classList.add("success");

}


/*=========================================================
    SHORT ADDRESS
=========================================================*/

function shortAddress(addr){

    if(!addr) return "—";

    return addr.substring(0,6)+"..."+addr.substring(addr.length-4);

}


/*=========================================================
    UPDATE UI
=========================================================*/

function updateWalletUI(){

    if(APP.connected){

        walletState.innerHTML="Wallet Connected";

        walletAddress.innerHTML=shortAddress(APP.account);

        connectBtn.innerHTML="Connected";

        depositBtn.disabled=false;

        redeemBtn.disabled=false;

    }

    else{

        walletState.innerHTML="Wallet not connected";

        walletAddress.innerHTML="—";

        connectBtn.innerHTML="Connect MetaMask";

        balance.innerHTML="0";

        network.innerHTML="—";

        depositBtn.disabled=true;

        redeemBtn.disabled=true;

    }

}


/*=========================================================
    NETWORK CHECK
=========================================================*/

async function ensureNetwork(){

    const chain=await APP.provider.getNetwork();

    if(Number(chain.chainId)===CONFIG.CHAIN_ID){

        network.innerHTML=CONFIG.CHAIN_NAME;

        return;

    }

    try{

        await window.ethereum.request({

            method:"wallet_switchEthereumChain",

            params:[

                {

                    chainId:CONFIG.CHAIN_HEX

                }

            ]

        });

    }

    catch(e){

        if(e.code===4902){

            await window.ethereum.request({

                method:"wallet_addEthereumChain",

                params:[

                    {

                        chainId:CONFIG.CHAIN_HEX,

                        chainName:CONFIG.CHAIN_NAME,

                        rpcUrls:[CONFIG.RPC_URL],

                        nativeCurrency:{

                            name:"ETH",

                            symbol:"ETH",

                            decimals:18

                        },

                        blockExplorerUrls:[

                            CONFIG.EXPLORER

                        ]

                    }

                ]

            });

        }

        else{

            throw e;

        }

    }

}


/*=========================================================
    LOAD BALANCE
=========================================================*/

async function loadBalance(){

    if(!APP.connected) return;

    try{

        const value=await APP.token.balanceOf(APP.account);

        balance.innerHTML=value.toString();

    }

    catch(e){

        balance.innerHTML="Error";

    }

}


/*=========================================================
    CONNECT WALLET
=========================================================*/

async function connectWallet(){

    if(typeof window.ethereum==="undefined"){

        setStatus(

            "MetaMask is not installed",

            "error"

        );

        return;

    }

    connectBtn.disabled=true;

    connectBtn.innerHTML="Connecting...";

    try{

        APP.provider=new ethers.BrowserProvider(window.ethereum);

        await ensureNetwork();

        const accounts=await APP.provider.send(

            "eth_requestAccounts",

            []

        );

        APP.signer=await APP.provider.getSigner();

        APP.account=accounts[0];

        APP.vault=new ethers.Contract(

            CONFIG.VAULT_ADDRESS,

            VAULT_ABI,

            APP.signer

        );

        APP.token=new ethers.Contract(

            CONFIG.TOKEN_ADDRESS,

            TOKEN_ABI,

            APP.signer

        );

        APP.connected=true;

        await loadBalance();

        updateWalletUI();

        setStatus(

            "Wallet connected successfully."

        );

    }

    catch(e){

        console.error(e);

        APP.connected=false;

        updateWalletUI();

        setStatus(

            e.message,

            "error"

        );

    }

    connectBtn.disabled=false;

}


/*=========================================================
    WALLET EVENTS
=========================================================*/

function initWalletEvents(){

    if(APP.eventsAdded) return;

    APP.eventsAdded=true;

    window.ethereum.on(

        "accountsChanged",

        async(accounts)=>{

            if(accounts.length===0){

                APP.connected=false;

                updateWalletUI();

                return;

            }

            await connectWallet();

        }

    );

    window.ethereum.on(

        "chainChanged",

        ()=>{

            window.location.reload();

        }

    );

}


/*=========================================================
    AUTO CONNECT
=========================================================*/

async function autoConnect(){

    if(typeof window.ethereum==="undefined") return;

    try{

        APP.provider=new ethers.BrowserProvider(window.ethereum);

        const accounts=await APP.provider.send(

            "eth_accounts",

            []

        );

        if(accounts.length){

            await connectWallet();

        }

    }

    catch(e){

        console.log(e);

    }

}


/*=========================================================
    START
=========================================================*/

connectBtn.onclick=connectWallet;

initWalletEvents();

autoConnect();
    /*=========================================================
    STOCK PRICES MODULE
=========================================================*/

/*
    Приоритет получения цен

    1. Chainlink Oracle
    2. TwelveData API
    3. Последнее успешное значение
*/


const PRICE_CONFIG={

    UPDATE_INTERVAL:15000,

    API_URL:"https://requests-awareness-chair-lodge.trycloudflare.com/api/quotes",

    SYMBOLS:[
        "AAPL",
        "TSLA",
        "NVDA",
        "AMD"
    ]

};
    
const PRICE_ABI=[

"function latestRoundData() view returns(uint80,int256,uint256,uint256,uint80)",

"function decimals() view returns(uint8)"

];



const LAST_PRICES={};



/*=========================================================
    FORMAT PRICE
=========================================================*/

function formatPrice(price){

    return "$"+Number(price).toLocaleString(

        undefined,

        {

            minimumFractionDigits:2,

            maximumFractionDigits:2

        }

    );

}



/*=========================================================
    UPDATE HTML
=========================================================*/

function updatePriceHTML(symbol,price,color="#00d395"){

    const el=document.getElementById(symbol);

    if(!el) return;

    el.innerHTML=formatPrice(price);

    el.style.color=color;

}



/*=========================================================
    SHOW ERROR
=========================================================*/

function showPriceError(symbol){

    const el=document.getElementById(symbol);

    if(!el) return;

    el.innerHTML="N/A";

    el.style.color="#ff5555";

}

/*=========================================================
    LOAD ALL
=========================================================*/
async function refreshPrices() {

    try {

        const response = await fetch(PRICE_CONFIG.API_URL);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const prices = await response.json();

        console.log("Prices:", prices);

        prices.forEach(item => {

            const el = document.getElementById(item.symbol);

            if (!el) {
                console.warn("No element:", item.symbol);
                return;
            }

            el.textContent = formatPrice(item.price);
            el.style.color =
                item.change >= 0
                    ? "#00d395"
                    : "#ff5555";

        });

    } catch (e) {

        console.error("Price error:", e);

        PRICE_CONFIG.SYMBOLS.forEach(showPriceError);

    }

} 
    
    /*=========================================================
    START PRICE LOOP
=========================================================*/

async function startPrices(){

    try{

        await refreshPrices();

    }

    catch(e){

        console.log(e);

    }

    setInterval(

        refreshPrices,

        PRICE_CONFIG.UPDATE_INTERVAL

    );

}



startPrices();
    /*=========================================================
    VAULT MODULE
=========================================================*/


/*---------------------------------------------------------
    ERC20 ABI
---------------------------------------------------------*/

const ERC20_ABI=[

"function decimals() view returns(uint8)",

"function symbol() view returns(string)",

"function balanceOf(address) view returns(uint256)",

"function allowance(address,address) view returns(uint256)",

"function approve(address,uint256) returns(bool)"

];


/*---------------------------------------------------------
    Vault ABI
---------------------------------------------------------*/

const VAULT_FULL_ABI=[

"function depositRWA(address,uint256,uint256,uint256)",

"function redeemRWA(uint256)",

"function depositCounter() view returns(uint256)",

"function getDeposit(uint256)view returns(tuple(address assetAddress,uint256 assetAmount,uint256 tokenAmount,uint256 redemptionDeadline,bool isRedeemed,bool isClaimed))"

];


/*---------------------------------------------------------
    Helpers
---------------------------------------------------------*/

function parseBigInt(value){

    try{

        if(value.startsWith("0x"))

            return BigInt(value);

        return BigInt(value);

    }

    catch{

        return null;

    }

}


function disableButtons(flag){

    depositBtn.disabled=flag;

    redeemBtn.disabled=flag;

}


/*---------------------------------------------------------
    Approve
---------------------------------------------------------*/

async function approveIfNeeded(

    tokenAddress,

    owner,

    spender,

    amount

){

    const token=new ethers.Contract(

        tokenAddress,

        ERC20_ABI,

        APP.signer

    );

    const allowance=

        await token.allowance(

            owner,

            spender

        );

    if(allowance>=amount){

        return true;

    }

    setStatus(

        "Approving token...",

        "success"

    );

    const tx=

        await token.approve(

            spender,

            ethers.MaxUint256

        );

    await tx.wait();

    return true;

}


/*---------------------------------------------------------
    Refresh Balance
---------------------------------------------------------*/

async function refreshWalletBalance(){

    try{

        await loadBalance();

    }

    catch(e){

        console.log(e);

    }

}


/*---------------------------------------------------------
    Deposit
---------------------------------------------------------*/

async function executeDeposit(){

    if(!APP.connected){

        setStatus(

            "Connect wallet first.",

            "error"

        );

        return;

    }

    disableButtons(true);

    try{

        const rwaAddress=

            assetAddress.value.trim();

        const rwaAmount=

            parseBigInt(

                assetAmount.value.trim()

            );

        const supply=

            BigInt(

                tokenSupply.value.trim()

            );

        const duration=

            Number(

                lockDuration.value

            );

        if(!ethers.isAddress(rwaAddress))

            throw new Error(

                "Invalid asset address."

            );

        if(rwaAmount===null)

            throw new Error(

                "Invalid amount."

            );

        if(supply<=0n)

            throw new Error(

                "Supply must be positive."

            );

        if(duration<=0)

            throw new Error(

                "Invalid duration."

            );

        const assetToken=

            new ethers.Contract(

                rwaAddress,

                ERC20_ABI,

                APP.signer

            );

        setStatus(

            "Checking allowance..."

        );

        await approveIfNeeded(

            rwaAddress,

            APP.account,

            CONFIG.VAULT_ADDRESS,

            rwaAmount

        );

        APP.vault=

            new ethers.Contract(

                CONFIG.VAULT_ADDRESS,

                VAULT_FULL_ABI,

                APP.signer

            );

        setStatus(

            "Sending transaction..."

        );

        const tx=

            await APP.vault.depositRWA(

                rwaAddress,

                rwaAmount,

                supply,

                duration

            );

        setStatus(

            "Waiting confirmation..."

        );

        const receipt=

            await tx.wait();

        if(receipt.status!==1)

            throw new Error(

                "Transaction failed."

            );

        const id=

            await APP.vault.depositCounter();

        depositId.value=id.toString();

        await refreshWalletBalance();

        setStatus(

            "Deposit successful.",

            "success"

        );

    }

    catch(e){

        console.error(e);

        setStatus(

            e.reason||

            e.shortMessage||

            e.message,

            "error"

        );

    }

    disableButtons(false);

}


/*---------------------------------------------------------
    Redeem
---------------------------------------------------------*/

async function executeRedeem(){

    if(!APP.connected){

        setStatus(

            "Connect wallet first.",

            "error"

        );

        return;

    }

    disableButtons(true);

    try{

        const id=

            Number(

                depositId.value

            );

        if(id<=0)

            throw new Error(

                "Invalid deposit id."

            );

        APP.vault=

            new ethers.Contract(

                CONFIG.VAULT_ADDRESS,

                VAULT_FULL_ABI,

                APP.signer

            );

        const info=

            await APP.vault.getDeposit(id);

        if(info.isRedeemed)

            throw new Error(

                "Already redeemed."

            );

        setStatus(

            "Sending redeem transaction..."

        );

        const tx=

            await APP.vault.redeemRWA(id);

        setStatus(

            "Waiting confirmation..."

        );

        const receipt=

            await tx.wait();

        if(receipt.status!==1)

            throw new Error(

                "Redeem failed."

            );

        await refreshWalletBalance();

        setStatus(

            "Redeem completed.",

            "success"

        );

    }

    catch(e){

        console.error(e);

        setStatus(

            e.reason||

            e.shortMessage||

            e.message,

            "error"

        );

    }

    disableButtons(false);

}


/*---------------------------------------------------------
    Events
---------------------------------------------------------*/

depositBtn.addEventListener(

    "click",

    executeDeposit

);


redeemBtn.addEventListener(

    "click",

    executeRedeem

);

        setStatus(

            "Internet connection lost.",

            "error"

        );

    }

);

=========================================================*/

window.addEventListener(

    "error",

    function(event){

        console.error(

            "Global Error:",

            event.error

        );

    }

);


window.addEventListener(

    "unhandledrejection",

    function(event){

        console.error(

            "Unhandled Promise:",

            event.reason

        );

    }

);


/*=========================================================

=========================================================*/

window.MWA={

    APP,

    CONFIG,

    connectWallet,

    refreshPrices,

    refreshWalletBalance

};


/*=========================================================

=========================================================*/

initializeApplication();

console.log("MWA initialized successfully");
