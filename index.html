<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MWA • Launch & Trade</title>

    <script src="./ethers.umd.min.js"></script>

    <style>
        :root {
            --bg: #081411;
            --panel: #10201c;
            --panel2: #132720;
            --green: #00d395;
            --green2: #00b67d;
            --text: #ffffff;
            --text2: #cfd8d6;
            --muted: #8fa69f;
            --red: #ff5555;
            --orange: #f39c12;
            --border: rgba(255,255,255,.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 80px rgba(0,0,0,.35);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 18px;
        }

        .section {
            margin-top: 25px;
            padding: 22px;
            background: var(--panel2);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .wallet {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 16px;
            background: #0d1b18;
            border-radius: 12px;
        }

        .wallet-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .wallet-address {
            color: var(--muted);
            font-size: 14px;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .btn-main {
            background: var(--green);
            color: #000;
        }

        .btn-main:hover:not(:disabled) {
            background: var(--green2);
        }

        .btn-buy {
            background: var(--green);
            color: #000;
        }

        .btn-sell {
            background: var(--red);
            color: white;
        }

        .btn-approve {
            background: var(--orange);
            color: black;
        }

        .btn-expired {
            background: #9b59b6;
            color: white;
        }

        .btn-reclaim {
            background: #3498db;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--muted);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #081411;
            color: white;
            font-size: 14px;
        }

        .ticker {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .card {
            background: #081411;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .symbol {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .price {
            font-size: 24px;
            font-weight: 700;
        }

        .change {
            margin-top: 5px;
            font-size: 12px;
        }

        .token-item {
            background: #081411;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .token-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .token-name {
            font-size: 17px;
            font-weight: 700;
        }

        .token-address {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .active {
            background: rgba(0,211,149,.15);
            color: var(--green);
        }

        .expired {
            background: rgba(243,156,18,.15);
            color: var(--orange);
        }

        .redeemed {
            background: rgba(255,85,85,.15);
            color: var(--red);
        }

        .token-stats {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat {
            background: #0d1b18;
            padding: 10px;
            border-radius: 8px;
        }

        .stat-title {
            color: var(--muted);
            font-size: 11px;
        }

        .stat-value {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 7px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .amount {
            width: 110px;
        }

        .expiry-box {
            margin-top: 12px;
            padding: 12px;
            background: rgba(243,156,18,.08);
            border: 1px solid rgba(243,156,18,.2);
            border-radius: 8px;
            color: #f5c36b;
            font-size: 13px;
        }

        .reclaim-box {
            margin-top: 12px;
            padding: 12px;
            background: rgba(52,152,219,.08);
            border: 1px solid rgba(52,152,219,.2);
            border-radius: 8px;
            color: #7fc8f5;
            font-size: 13px;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-left: 4px solid var(--green);
            background: #081411;
            border-radius: 8px;
            word-break: break-word;
        }

        .status.error {
            border-left-color: var(--red);
        }

        .status.pending {
            border-left-color: var(--orange);
        }

        .status.success {
            border-left-color: var(--green);
        }

        .api-status {
            margin-top: 8px;
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }

        .footer {
            margin-top: 35px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        @media(max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .ticker {
                grid-template-columns: repeat(2,1fr);
            }

            .token-stats {
                grid-template-columns: repeat(2,1fr);
            }

            .wallet {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MWA • Launch & Trade</h1>

    <!-- WALLET -->
    <div class="wallet">

        <div class="wallet-info">
            <div id="walletState">
                Wallet not connected
            </div>

            <div class="wallet-address" id="walletAddress">
                —
            </div>
        </div>

        <button id="connectBtn" class="btn-main">
            Connect MetaMask
        </button>

    </div>


    <!-- STOCK PRICES -->
    <div class="ticker">

        <div class="card">
            <div class="symbol">AAPL</div>
            <div class="price" id="price_AAPL">--</div>
            <div class="change" id="change_AAPL">--</div>
        </div>

        <div class="card">
            <div class="symbol">TSLA</div>
            <div class="price" id="price_TSLA">--</div>
            <div class="change" id="change_TSLA">--</div>
        </div>

        <div class="card">
            <div class="symbol">NVDA</div>
            <div class="price" id="price_NVDA">--</div>
            <div class="change" id="change_NVDA">--</div>
        </div>

        <div class="card">
            <div class="symbol">AMD</div>
            <div class="price" id="price_AMD">--</div>
            <div class="change" id="change_AMD">--</div>
        </div>

    </div>

    <div class="api-status" id="priceStatus">
        Connecting to market data...
    </div>


    <!-- LAUNCH -->
    <div class="section">

        <h2>📦 Launch New Token</h2>

        <div class="grid">

            <div>
                <label>Token Name</label>
                <input id="tokenName" value="My Meme" maxlength="60">
            </div>

            <div>
                <label>Token Symbol</label>
                <input id="tokenSymbol" value="MEME" maxlength="20">
            </div>

            <div>
                <label>Token Supply</label>
                <input id="tokenSupply" type="number" value="1000000">
            </div>

            <div>
                <label>RWA Asset</label>

                <select id="assetSelect">

                    <option value="0xC9f9c86933092BbbfFF3CCb4b105A4A94bf3Bd4E">
                        AMD
                    </option>

                    <option value="0x71178BAc73cBeb415514eB542a8995b82669778d">
                        TSLA
                    </option>

                    <option value="0x7dF7F09271136b49bD1E44937FA758264024858C">
                        AAPL
                    </option>

                </select>
            </div>

            <div>
                <label>Asset Amount (wei)</label>
                <input id="assetAmount" value="1000000000000000000">
            </div>

            <div>
                <label>Lock Duration (seconds)</label>
                <input id="lockDuration" type="number" value="600" min="60">
            </div>

        </div>

        <div style="margin-top:12px;color:#9cb4ad;font-size:13px;">
            ⚡ ETH needed for liquidity:
            <b id="ethNeeded">0.01</b> ETH
        </div>

        <button
            id="launchBtn"
            class="btn-main"
            style="margin-top:18px;width:100%;"
            disabled
        >
            🚀 Launch Token
        </button>

    </div>


    <!-- TOKENS -->
    <div class="section">

        <h2>📊 Your Tokens</h2>

        <div id="tokenList">

            <div style="color:#9cb4ad;text-align:center;padding:20px;">
                Connect wallet to load tokens.
            </div>

        </div>

    </div>


    <!-- MANUAL REDEEM -->
    <div class="section">

        <h2>🔄 RWA Redemption</h2>

        <label>Deposit ID</label>

        <input
            id="depositId"
            type="number"
            min="1"
            value="1"
        >

        <button
            id="redeemBtn"
            class="btn-main"
            style="margin-top:12px;width:100%;"
            disabled
        >
            Redeem RWA
        </button>

    </div>


    <div class="status" id="status">
        Ready.
    </div>

    <div class="footer">
        MWA Protocol v3 — Router
    </div>

</div>


<script>

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const CONFIG = {

    CHAIN_ID: 46630,

    CHAIN_HEX: "0xb626",

    CHAIN_NAME: "Robinhood Testnet",

    RPC_URL:
        "https://rpc.testnet.chain.robinhood.com",

    EXPLORER:
        "https://explorer.testnet.chain.robinhood.com",

    ROUTER_ADDRESS:
        "0x0e5b59459F8F0315E4eF513bF64BD154EE3A2B6A",

    ETH_LIQUIDITY:
        "0.01"

};


/* ============================================================
   PRICE API
============================================================ */

const PRICE_CONFIG = {

    API_URL:
        "https://requests-awareness-chair-lodge.trycloudflare.com/api/quotes",

    UPDATE_INTERVAL:
        15000,

    SYMBOLS:
        ["AAPL","TSLA","NVDA","AMD"]

};


/* ============================================================
   ROUTER ABI
============================================================ */

const ROUTER_ABI = [

    "function launch(string,string,uint256,address,uint256,uint256) payable",

    "function buy(address,uint256) payable",

    "function sell(address,uint256,uint256)",

    "function redeem(uint256)",

    /*
     * NEW:
     * post-expiry redemption
     *
     * IMPORTANT:
     * This function must exist in the Solidity Router.
     */
    "function redeemAfterExpiry(uint256)",

    /*
     * Optional buyout function.
     *
     * If your Router uses another name/signature,
     * change it here.
     */
    "function buyRemaining(uint256) payable",

    "function getDeposit(uint256) view returns(tuple(address assetAddress,uint256 assetAmount,address memeToken,uint256 memeTokenAmount,uint256 redemptionDeadline,bool isRedeemed,bool isClaimed))",

    "function getActiveTokens() view returns(address[])",

    "function getReserves(address) view returns(uint256,uint256)",

    "function getPrice(address) view returns(uint256)",

    "function depositCounter() view returns(uint256)",

    "function tokenInfoMap(address) view returns(address tokenAddress,string name,string symbol,uint256 totalSupply,uint256 reserveETH,uint256 reserveTokens,uint256 price,uint256 lastUpdate,bool isActive)"

];


/* ============================================================
   TOKEN ABI
============================================================ */

const TOKEN_ABI = [

    "function balanceOf(address) view returns(uint256)",

    "function totalSupply() view returns(uint256)",

    "function name() view returns(string)",

    "function symbol() view returns(string)",

    "function approve(address,uint256) returns(bool)",

    "function allowance(address,address) view returns(uint256)"

];


/* ============================================================
   APP STATE
============================================================ */

const APP = {

    provider: null,

    signer: null,

    router: null,

    account: null,

    connected: false,

    tokenCache: new Map(),

    deposits: [],

    eventsAdded: false

};


/* ============================================================
   DOM
============================================================ */

const $ = id =>
    document.getElementById(id);

const connectBtn =
    $("connectBtn");

const walletState =
    $("walletState");

const walletAddress =
    $("walletAddress");

const launchBtn =
    $("launchBtn");

const redeemBtn =
    $("redeemBtn");

const tokenList =
    $("tokenList");

const status =
    $("status");

const priceStatus =
    $("priceStatus");

const depositId =
    $("depositId");


/* ============================================================
   STATUS
============================================================ */

function setStatus(
    message,
    type = "success"
) {

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* ============================================================
   ERROR
============================================================ */

function getErrorMessage(error) {

    if (!error)
        return "Unknown error";

    return (

        error.reason ||

        error.shortMessage ||

        error.info?.error?.message ||

        error.data?.message ||

        error.message ||

        String(error)

    );

}


/* ============================================================
   ADDRESS
============================================================ */

function shortAddress(address) {

    if (!address)
        return "—";

    if (
        address ===
        "0x0000000000000000000000000000000000000000"
    )
        return "—";

    return (
        address.slice(0,6) +
        "..." +
        address.slice(-4)
    );

}


function isZeroAddress(address) {

    return (
        !address ||
        address.toLowerCase() ===
        "0x0000000000000000000000000000000000000000"
    );

}


/* ============================================================
   NUMBER
============================================================ */

function safeNumber(value) {

    try {

        if (
            typeof value ===
            "bigint"
        )
            return Number(value);

        if (
            typeof value ===
            "number"
        )
            return value;

        if (
            typeof value ===
            "string"
        )
            return Number(value);

        return Number(value);

    } catch {

        return 0;

    }

}


/* ============================================================
   WALLET
============================================================ */

function updateWalletUI() {

    if (APP.connected) {

        walletState.textContent =
            "Wallet Connected";

        walletAddress.textContent =
            shortAddress(APP.account);

        connectBtn.textContent =
            "Connected";

        launchBtn.disabled =
            false;

        redeemBtn.disabled =
            false;

    } else {

        walletState.textContent =
            "Wallet not connected";

        walletAddress.textContent =
            "—";

        connectBtn.textContent =
            "Connect MetaMask";

        launchBtn.disabled =
            true;

        redeemBtn.disabled =
            true;

    }

}


/* ============================================================
   NETWORK
============================================================ */

async function ensureNetwork() {

    const network =
        await APP.provider.getNetwork();

    if (
        Number(network.chainId) ===
        CONFIG.CHAIN_ID
    )
        return;

    try {

        await window.ethereum.request({

            method:
                "wallet_switchEthereumChain",

            params: [{
                chainId:
                    CONFIG.CHAIN_HEX
            }]

        });

    } catch(error) {

        if (
            error.code === 4902
        ) {

            await window.ethereum.request({

                method:
                    "wallet_addEthereumChain",

                params: [{

                    chainId:
                        CONFIG.CHAIN_HEX,

                    chainName:
                        CONFIG.CHAIN_NAME,

                    rpcUrls: [
                        CONFIG.RPC_URL
                    ],

                    nativeCurrency: {

                        name:
                            "ETH",

                        symbol:
                            "ETH",

                        decimals:
                            18

                    },

                    blockExplorerUrls: [
                        CONFIG.EXPLORER
                    ]

                }]

            });

        } else {

            throw error;

        }

    }

}


/* ============================================================
   CONNECT
============================================================ */

async function connectWallet() {

    if (
        typeof window.ethereum ===
        "undefined"
    ) {

        setStatus(
            "MetaMask is not installed.",
            "error"
        );

        return;

    }

    connectBtn.disabled =
        true;

    connectBtn.textContent =
        "Connecting...";

    try {

        APP.provider =
            new ethers.BrowserProvider(
                window.ethereum
            );

        await ensureNetwork();

        const accounts =
            await APP.provider.send(
                "eth_requestAccounts",
                []
            );

        if (
            !accounts.length
        )
            throw new Error(
                "No wallet account."
            );

        APP.account =
            accounts[0];

        APP.signer =
            await APP.provider.getSigner();

        APP.router =
            new ethers.Contract(
                CONFIG.ROUTER_ADDRESS,
                ROUTER_ABI,
                APP.signer
            );

        APP.connected =
            true;

        updateWalletUI();

        setStatus(
            "Wallet connected successfully.",
            "success"
        );

        await renderTokenList();

        try {

            const counter =
                await APP.router.depositCounter();

            depositId.value =
                safeNumber(counter) || 1;

        } catch {}

    } catch(error) {

        console.error(
            "Connect error:",
            error
        );

        APP.connected =
            false;

        updateWalletUI();

        setStatus(
            getErrorMessage(error),
            "error"
        );

    } finally {

        connectBtn.disabled =
            false;

    }

}


/* ============================================================
   TOKEN INFO
============================================================ */

async function getTokenInfo(
    tokenAddress
) {

    const key =
        tokenAddress.toLowerCase();

    if (
        APP.tokenCache.has(key)
    )
        return APP.tokenCache.get(key);

    try {

        const token =
            new ethers.Contract(
                tokenAddress,
                TOKEN_ABI,
                APP.provider
            );

        const [
            name,
            symbol,
            totalSupply
        ] =
            await Promise.all([

                token.name(),

                token.symbol(),

                token.totalSupply()

            ]);

        const result = {

            name,

            symbol,

            totalSupply,

            token

        };

        APP.tokenCache.set(
            key,
            result
        );

        return result;

    } catch(error) {

        console.warn(
            "Token info error:",
            error
        );

        return null;

    }

}


/* ============================================================
   TOKEN BALANCE
============================================================ */

async function getTokenBalance(
    tokenAddress
) {

    if (
        !APP.account
    )
        return 0n;

    try {

        const token =
            new ethers.Contract(
                tokenAddress,
                TOKEN_ABI,
                APP.provider
            );

        return await token.balanceOf(
            APP.account
        );

    } catch {

        return 0n;

    }

}


/* ============================================================
   LOAD DEPOSITS
============================================================ */

async function loadDeposits() {

    if (
        !APP.connected ||
        !APP.router
    )
        return [];

    try {

        const counter =
            safeNumber(
                await APP.router.depositCounter()
            );

        const deposits = [];

        for (
            let id = 1;
            id <= counter;
            id++
        ) {

            try {

                const d =
                    await APP.router.getDeposit(id);

                if (
                    isZeroAddress(
                        d.memeToken
                    )
                )
                    continue;

                deposits.push({

                    id,

                    assetAddress:
                        d.assetAddress,

                    assetAmount:
                        d.assetAmount,

                    memeToken:
                        d.memeToken,

                    memeTokenAmount:
                        d.memeTokenAmount,

                    redemptionDeadline:
                        d.redemptionDeadline,

                    isRedeemed:
                        d.isRedeemed,

                    isClaimed:
                        d.isClaimed

                });

            } catch(error) {

                console.warn(
                    "Deposit",
                    id,
                    error
                );

            }

        }

        APP.deposits =
            deposits;

        return deposits;

    } catch(error) {

        console.error(
            "loadDeposits:",
            error
        );

        return [];

    }

}


/* ============================================================
   FORMAT TOKEN AMOUNT
============================================================ */

function formatTokenAmount(
    value
) {

    try {

        return Number(value)
            .toLocaleString(
                undefined,
                {
                    maximumFractionDigits:
                        6
                }
            );

    } catch {

        return "0";

    }

}


/* ============================================================
   RENDER TOKENS
============================================================ */

async function renderTokenList() {

    if (
        !APP.connected
    ) {

        tokenList.innerHTML = `
            <div style="
                color:#9cb4ad;
                padding:20px;
                text-align:center;
            ">
                Connect wallet to see your tokens.
            </div>
        `;

        return;

    }

    const deposits =
        await loadDeposits();

    if (
        deposits.length === 0
    ) {

        tokenList.innerHTML = `
            <div style="
                color:#9cb4ad;
                padding:20px;
                text-align:center;
            ">
                No tokens found.
                Launch your first token!
            </div>
        `;

        return;

    }

    let html = "";

    for (
        const d of deposits
    ) {

        const info =
            await getTokenInfo(
                d.memeToken
            );

        if (!info)
            continue;

        const balance =
            await getTokenBalance(
                d.memeToken
            );

        const deadline =
            safeNumber(
                d.redemptionDeadline
            );

        const now =
            Math.floor(
                Date.now() / 1000
            );

        const expired =
            now >= deadline;

        const redeemed =
            d.isRedeemed;

        let state =
            "ACTIVE";

        let stateClass =
            "active";

        if (redeemed) {

            state =
                "REDEEMED";

            stateClass =
                "redeemed";

        } else if (expired) {

            state =
                "EXPIRED";

            stateClass =
                "expired";

        }

        const totalSupply =
            d.memeTokenAmount;

        const balanceNumber =
            safeNumber(balance);

        const totalNumber =
            safeNumber(totalSupply);

        const remaining =
            Math.max(
                totalNumber -
                balanceNumber,
                0
            );

        html += `

            <div class="token-item">

                <div class="token-header">

                    <div>

                        <div class="token-name">
                            ${info.name}
                            (${info.symbol})
                        </div>

                        <div class="token-address">

/* ============================================================
   BUY
============================================================ */

async function buyToken(
    tokenAddress,
    depositId
) {

    try {

        const input =
            document.getElementById(
                `amount_${depositId}`
            );

        const amount =
            BigInt(
                Math.max(
                    1,
                    parseInt(input.value || "1")
                )
            );

        setStatus(
            `Buying ${amount} tokens...`,
            "pending"
        );

        const reserves =
            await APP.router.getReserves(
                tokenAddress
            );

        const reserveETH =
            reserves[0];

        const reserveTokens =
            reserves[1];

        if (
            reserveTokens === 0n
        )
            throw new Error(
                "No token liquidity."
            );

        /*
         * Constant-product estimate.
         *
         * ETH required:
         *
         * dy = y * dx / (x - dx)
         */

        const ethRequired =
            (
                reserveETH *
                amount
            ) /
            (
                reserveTokens -
                amount
            );

        const ethWithSlippage =
            ethRequired +
            (
                ethRequired *
                5n
            ) /
            100n;

        const tx =
            await APP.router.buy(
                tokenAddress,
                amount,
                {
                    value:
                        ethWithSlippage
                }
            );

        await tx.wait();

        setStatus(
            `✅ Bought ${amount} tokens.`,
            "success"
        );

        await renderTokenList();

    } catch(error) {

        console.error(error);

        setStatus(
            "Buy failed: " +
            getErrorMessage(error),
            "error"
        );

    }

}


/* ============================================================
   SELL
============================================================ */

async function sellToken(
    tokenAddress,
    depositId
) {

    try {

        const input =
            document.getElementById(
                `amount_${depositId}`
            );

        const amount =
            BigInt(
                Math.max(
                    1,
                    parseInt(input.value || "1")
                )
            );

        const token =
            new ethers.Contract(
                tokenAddress,
                TOKEN_ABI,
                APP.signer
            );

        const balance =
            await token.balanceOf(
                APP.account
            );

        if (
            balance < amount
        )
            throw new Error(
                "Insufficient token balance."
            );

        const allowance =
            await token.allowance(
                APP.account,
                CONFIG.ROUTER_ADDRESS
            );

        if (
            allowance < amount
        ) {

            setStatus(
                "Approving token first...",
                "pending"
            );

            const approveTx =
                await token.approve(
                    CONFIG.ROUTER_ADDRESS,
                    ethers.MaxUint256
                );

            await approveTx.wait();

        }

        const reserves =
            await APP.router.getReserves(
                tokenAddress
            );

        const reserveETH =
            reserves[0];

        const reserveTokens =
            reserves[1];

        if (
            reserveTokens === 0n
        )
            throw new Error(
                "No token liquidity."
            );

        const expectedETH =
            (
                amount *
                reserveETH
            ) /
            (
                reserveTokens +
                amount
            );

        const minETH =
            (
                expectedETH *
                95n
            ) /
            100n;

        setStatus(
            `Selling ${amount} tokens...`,
            "pending"
        );

        const tx =
            await APP.router.sell(
                tokenAddress,
                amount,
                minETH
            );

        await tx.wait();

        setStatus(
            `✅ Sold ${amount} tokens.`,
            "success"
        );

        await renderTokenList();

    } catch(error) {

        console.error(error);

        setStatus(
            "Sell failed: " +
            getErrorMessage(error),
            "error"
        );

    }

}


/* ============================================================
   BUY REMAINING AFTER EXPIRY
============================================================ */

async function buyRemaining(
    id
) {

    try {

        const deposit =
            await APP.router.getDeposit(id);

        const tokenAddress =
            deposit.memeToken;

        if (
            isZeroAddress(tokenAddress)
        )
            throw new Error(
                "Invalid meme token."
            );

        const token =
            new ethers.Contract(
                tokenAddress,
                TOKEN_ABI,
                APP.provider
            );

        const total =
            await token.totalSupply();

        const creatorBalance =
            await token.balanceOf(
                APP.account
            );

        const remaining =
            total > creatorBalance
                ? total - creatorBalance
                : 0n;

        if (
            remaining === 0n
        ) {

            setStatus(
                "You already own all required tokens.",
                "success"
            );

            await renderTokenList();

            return;

        }

        /*
         * This function must be implemented
         * by the Router.
         */

        setStatus(
            `Buying ${remaining} remaining tokens...`,
            "pending"
        );

        const reserves =
            await APP.router.getReserves(
                tokenAddress
            );

        const reserveETH =
            reserves[0];

        const reserveTokens =
            reserves[1];

        if (
            reserveTokens === 0n
        )
            throw new Error(
                "No liquidity available."
            );

        const ethRequired =
            (
                reserveETH *
                remaining
            ) /
            (
                reserveTokens -
                remaining
            );

        const ethValue =
            ethRequired +
            (
                ethRequired *
                5n
            ) /
            100n;

        const tx =
            await APP.router.buyRemaining(
                id,
                {
                    value:
                        ethValue
                }
            );

        await tx.wait();

        setStatus(
            "✅ Remaining tokens purchased.",
            "success"
        );

        await renderTokenList();

    } catch(error) {

        console.error(
            "buyRemaining:",
            error
        );

        setStatus(
            "Buy remaining failed: " +
            getErrorMessage(error),
            "error"
        );

    }

}


/* ============================================================
   RECLAIM EXPIRED RWA
============================================================ */

async function reclaimExpiredRWA(
    id
) {

    try {

        const deposit =
            await APP.router.getDeposit(id);

        if (
            deposit.isRedeemed
        )
            throw new Error(
                "Deposit already redeemed."
            );

        const deadline =
            safeNumber(
                deposit.redemptionDeadline
            );

        const now =
            Math.floor(
                Date.now() / 1000
            );

        if (
            now < deadline
        )
            throw new Error(
                "Lock period has not expired yet."
            );

        const token =
            new ethers.Contract(
                deposit.memeToken,
                TOKEN_ABI,
                APP.provider
            );

        const balance =
            await token.balanceOf(
                APP.account
            );

        const required =
            deposit.memeTokenAmount;

        if (
            balance < required
        ) {

            throw new Error(
                "You do not own the complete token amount. Buy the remaining tokens first."
            );

        }

        /*
         * Approve Router.
         */

        const signerToken =
            new ethers.Contract(
                deposit.memeToken,
                TOKEN_ABI,
                APP.signer
            );

        const allowance =
            await signerToken.allowance(
                APP.account,
                CONFIG.ROUTER_ADDRESS
            );

        if (
            allowance < required
        ) {

            setStatus(
                "Approving tokens for RWA reclaim...",
                "pending"
            );

            const txApprove =
                await signerToken.approve(
                    CONFIG.ROUTER_ADDRESS,
                    ethers.MaxUint256
                );

            await txApprove.wait();

        }

        setStatus(
            `Returning tokens and reclaiming RWA for deposit ${id}...`,
            "pending"
        );

        /*
         * NEW CONTRACT FUNCTION
         */

        const tx =
            await APP.router.redeemAfterExpiry(
                id
            );

        await tx.wait();

        setStatus(
            `✅ RWA successfully reclaimed for deposit ${id}.`,
            "success"
        );

        APP.tokenCache.clear();

        await renderTokenList();

    } catch(error) {

        console.error(
            "reclaimExpiredRWA:",
            error
        );

        setStatus(
            "RWA reclaim failed: " +
            getErrorMessage(error),
            "error"
        );

    }

}


/* ============================================================
   LAUNCH
============================================================ */

async function launchToken() {

    if (
        !APP.connected
    ) {

        setStatus(
            "Connect wallet first.",
            "error"
        );

        return;

    }

    launchBtn.disabled =
        true;

    try {

        const name =
            $("tokenName")
                .value
                .trim();

        const symbol =
            $("tokenSymbol")
                .value
                .trim();

        const supply =
            BigInt(
                $("tokenSupply")
                    .value
                    .trim()
            );

        const asset =
            $("assetSelect")
                .value
                .trim();

        const assetAmount =
            BigInt(
                $("assetAmount")
                    .value
                    .trim()
            );

        const duration =
            Number(
                $("lockDuration")
                    .value
            );

        if (!name)
            throw new Error(
                "Token name required."
            );

        if (!symbol)
            throw new Error(
                "Token symbol required."
            );

        if (
            supply <= 0n
        )
            throw new Error(
                "Supply must be positive."
            );

        if (
            !ethers.isAddress(asset)
        )
            throw new Error(
                "Invalid asset address."
            );

        if (
            assetAmount <= 0n
        )
            throw new Error(
                "Asset amount must be positive."
            );

        if (
            duration < 60
        )
            throw new Error(
                "Lock duration must be at least 60 seconds."
            );

        setStatus(
            `Launching ${name} (${symbol})...`,
            "pending"
        );

        const tx =
            await APP.router.launch(

                name,

                symbol,

                supply,

                asset,

                assetAmount,

                duration,

                {
                    value:
                        ethers.parseEther(
                            CONFIG.ETH_LIQUIDITY
                        )
                }

            );

        setStatus(
            "⏳ Waiting for blockchain confirmation...",
            "pending"
        );

        await tx.wait();

        const counter =
            await APP.router.depositCounter();

        depositId.value =
            safeNumber(counter);

        APP.tokenCache.clear();

        await renderTokenList();

        setStatus(
            `✅ ${name} (${symbol}) launched. Deposit ID: ${counter}`,
            "success"
        );

    } catch(error) {

        console.error(
            "Launch error:",
            error
        );

        setStatus(
            "Launch failed: " +
            getErrorMessage(error),
            "error"
        );

    } finally {

        launchBtn.disabled =
            !APP.connected;

    }

}


/* ============================================================
   MANUAL REDEEM
============================================================ */

async function redeemManual() {

    try {

        const id =
            Number(
                depositId.value
            );

        if (
            !Number.isInteger(id) ||
            id <= 0
        )
            throw new Error(
                "Invalid deposit ID."
            );

        const d =
            await APP.router.getDeposit(
                id
            );

        if (
            d.isRedeemed
        )
            throw new Error(
                "Deposit already redeemed."
            );

        const deadline =
            safeNumber(
                d.redemptionDeadline
            );

        const now =
            Math.floor(
                Date.now() / 1000
            );

        /*
         * IMPORTANT:
         *
         * Before expiry -> redeem()
         *
         * After expiry -> redeemAfterExpiry()
         */

        if (
            now >= deadline
        ) {

            await reclaimExpiredRWA(
                id
            );

            return;

        }

        const token =
            new ethers.Contract(
                d.memeToken,
                TOKEN_ABI,
                APP.provider
            );

        const balance =
            await token.balanceOf(
                APP.account
            );

        if (
            balance <
            d.memeTokenAmount
        )
            throw new Error(
                "You must own all meme tokens before redemption."
            );

        const signerToken =
            new ethers.Contract(
                d.memeToken,
                TOKEN_ABI,
                APP.signer
            );

        const allowance =
            await signerToken.allowance(
                APP.account,
                CONFIG.ROUTER_ADDRESS
            );

        if (
            allowance <
            d.memeTokenAmount
        ) {

            setStatus(
                "Approving tokens...",
                "pending"
            );

            const approveTx =
                await signerToken.approve(
                    CONFIG.ROUTER_ADDRESS,
                    ethers.MaxUint256
                );

            await approveTx.wait();

        }

        setStatus(
            `Redeeming deposit ${id}...`,
            "pending"
        );

        const tx =
            await APP.router.redeem(
                id
            );

        await tx.wait();

        setStatus(
            `✅ Deposit ${id} redeemed.`,
            "success"
        );

        await renderTokenList();

    } catch(error) {

        console.error(
            "Redeem:",
            error
        );

        setStatus(
            "Redeem failed: " +
            getErrorMessage(error),
            "error"
        );

    }

}


/* ============================================================
   PRICE PARSER
============================================================ */

/*
 * Supports all of these:
 *
 * [
 *   {symbol:"AAPL",price:309.38,change:1.2}
 * ]
 *
 * {
 *   data: [...]
 * }
 *
 * {
 *   quotes: [...]
 * }
 *
 * {
 *   AAPL: {price:309.38,change:1.2}
 * }
 *
 * {
 *   AAPL: 309.38
 * }
 */

function normalizePrices(payload) {

    let rows = [];

    if (
        Array.isArray(payload)
    ) {

        rows =
            payload;

    } else if (
        Array.isArray(payload.data)
    ) {

        rows =
            payload.data;

    } else if (
        Array.isArray(payload.quotes)
    ) {

        rows =
            payload.quotes;

    } else if (
        payload &&
        typeof payload ===
        "object"
    ) {

        for (
            const symbol of PRICE_CONFIG.SYMBOLS
        ) {

            const item =
                payload[symbol];

            if (
                item ===
                undefined
            )
                continue;

            if (
                typeof item ===
                "number"
            ) {

                rows.push({

                    symbol,

                    price:
                        item,

                    change:
                        0

                });

            } else {

                rows.push({

                    symbol,

                    price:
                        item.price ??
                        item.last ??
                        item.close ??
                        item.value,

                    change:
                        item.change ??
                        item.changePercent ??
                        item.percentChange ??
                        0

                });

            }

        }

    }

    return rows
        .map(item => ({

            symbol:
                String(
                    item.symbol ??
                    item.ticker ??
                    item.code ??
                    ""
                ).toUpperCase(),

            price:
                Number(
                    item.price ??
                    item.last ??
                    item.close ??
                    item.value
                ),

            change:
                Number(
                    item.change ??
                    item.changePercent ??
                    item.percentChange ??
                    0
                )

        }))
        .filter(item =>

            PRICE_CONFIG.SYMBOLS
                .includes(item.symbol)

            &&

            Number.isFinite(
                item.price
            )

        );

}


/* ============================================================
   FORMAT PRICE
============================================================ */

function formatPrice(
    price
) {

    return new Intl.NumberFormat(
        "en-US",
        {
            style:
                "currency",

            currency:
                "USD",

            minimumFractionDigits:
                2,

            maximumFractionDigits:
                2
        }
    ).format(price);

}


/* ============================================================
   REFRESH PRICES
============================================================ */

async function refreshPrices() {

    try {

        priceStatus.textContent =
            "Updating market data...";

        const response =
            await fetch(
                PRICE_CONFIG.API_URL +
                "?symbols=" +
                encodeURIComponent(
                    PRICE_CONFIG.SYMBOLS.join(",")
                ) +
                "&_=" +
                Date.now(),
                {
                    method:
                        "GET",

                    cache:
                        "no-store"
                }
            );

        if (
            !response.ok
        )
            throw new Error(
                `HTTP ${response.status}`
            );

        const text =
            await response.text();

        if (!text)
            throw new Error(
                "Empty API response"
            );

        let payload;

        try {

            payload =
                JSON.parse(text);

        } catch {

            throw new Error(
                "API returned invalid JSON"
            );

        }

        console.log(
            "PRICE API RESPONSE:",
            payload
        );

        const prices =
            normalizePrices(
                payload
            );

        if (
            prices.length === 0
        )
            throw new Error(
                "No supported quotes found in API response"
            );

        for (
            const item of prices
        ) {

            const priceEl =
                $(
                    "price_" +
                    item.symbol
                );

            const changeEl =
                $(
                    "change_" +
                    item.symbol
                );

            if (!priceEl)
                continue;

            priceEl.textContent =
                formatPrice(
                    item.price
                );

            const change =
                item.change;

            changeEl.textContent =
                Number.isFinite(change)
                    ? (
                        (change >= 0
                            ? "+"
                            : "") +
                        change.toFixed(2) +
                        "%"
                    )
                    : "";

            priceEl.style.color =
                change >= 0
                    ? "#00d395"
                    : "#ff5555";

            changeEl.style.color =
                change >= 0
                    ? "#00d395"
                    : "#ff5555";

        }

        priceStatus.textContent =
            "Market data updated • " +
            new Date()
                .toLocaleTimeString();

    } catch(error) {

        console.error(
            "PRICE API ERROR:",
            error
        );

        priceStatus.textContent =
            "Market data error: " +
            error.message;

    }

}

function initWalletEvents() {

        APP.eventsAdded
    )
        return;

    if (
        typeof window.ethereum ===
        "undefined"
    )
        return;

    APP.eventsAdded =
        true;

    window.ethereum.on(
        "accountsChanged",
        async accounts => {

            if (
                accounts.length === 0
            ) {

                APP.connected =
                    false;

                APP.account =
                    null;

                updateWalletUI();

                return;

            }

            await connectWallet();

        }
    );


    window.ethereum.on(
        "chainChanged",
        () => {

            window.location.reload();

        }
    );

}

============================================================ */

async function autoConnect() {

    if (
        typeof window.ethereum ===
        "undefined"
    )
        return;

    try {

        APP.provider =
            new ethers.BrowserProvider(
                window.ethereum
            );

        const accounts =
            await APP.provider.send(
                "eth_accounts",
                []
            );

        if (
            accounts.length
        )
            await connectWallet();

    } catch(error) {

        console.warn(
            "Auto-connect:",
            error
        );

    }

}


/* ============================================================
   INIT
============================================================ */

async function init() {

    console.log(
        "MWA Launch & Trade v4"
    );

    console.log(
        "Router:",
        CONFIG.ROUTER_ADDRESS
    );

    updateWalletUI();

    initWalletEvents();

    await refreshPrices();

    await autoConnect();

}


init();


/* ============================================================
   INTERVALS
============================================================ */

setInterval(
    refreshPrices,
    PRICE_CONFIG.UPDATE_INTERVAL
);


setInterval(
    async () => {

        if (
            APP.connected
        )
            await renderTokenList();

    },
    15000
);


/* ============================================================
   VISIBILITY
============================================================ */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.hidden
        )
            return;

        await refreshPrices();

        if (
            APP.connected
        ) {

            APP.tokenCache.clear();

            await renderTokenList();

        }

    }
);

</script>

</html>
