<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWA • Launch & Trade</title>
    <script src="./ethers.umd.min.js"></script>
    <style>
        :root {
            --bg: #081411;
            --panel: #10201c;
            --panel2: #132720;
            --green: #00d395;
            --green2: #00b67d;
            --text: #ffffff;
            --text2: #cfd8d6;
            --red: #ff5555;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: Inter, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .section {
            margin-top: 28px;
            padding: 24px;
            background: var(--panel2);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .wallet {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 16px;
            background: #0d1b18;
            border-radius: 12px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .wallet-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .wallet-address {
            font-size: 14px;
            color: var(--text2);
        }

        button {
            background: var(--green);
            color: black;
            border: none;
            padding: 13px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.2s;
        }

        button:hover:not(:disabled) {
            background: var(--green2);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        button.small {
            padding: 6px 14px;
            font-size: 13px;
            margin-left: 8px;
        }

        button.danger {
            background: #ff5555;
            color: white;
        }

        button.danger:hover:not(:disabled) {
            background: #cc4444;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            background: #081411;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #9cb4ad;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            background: #081411;
            border-left: 4px solid var(--green);
            border-radius: 8px;
            word-break: break-word;
        }

        .status.error {
            border-left-color: var(--red);
        }

        .status.success {
            border-left-color: var(--green);
        }

        .status.pending {
            border-left-color: #f39c12;
        }

        .ticker {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .card {
            background: #081411;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
        }

        .symbol {
            font-size: 13px;
            opacity: 0.6;
            margin-bottom: 10px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            opacity: 0.4;
            font-size: 12px;
        }

        #tokenList {
            margin-top: 10px;
        }

        .token-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #081411;
            border-radius: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .token-item .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .token-item .info .name {
            font-weight: 600;
        }

        .token-item .info .address {
            font-size: 12px;
            color: #9cb4ad;
        }

        .token-item .balance {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .token-item .balance .available {
            font-size: 12px;
            color: #9cb4ad;
        }

        .token-item .actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .buy-sell-input {
            width: 80px;
            padding: 4px 8px;
            font-size: 13px;
            background: #081411;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            border-radius: 4px;
        }

        .btn-buy {
            background: #00d395;
            color: #000;
        }

        .btn-buy:hover {
            background: #00b67d;
        }

        .btn-sell {
            background: #ff5555;
            color: #fff;
        }

        .btn-sell:hover {
            background: #cc4444;
        }

        .btn-approve {
            background: #f39c12;
            color: #000;
        }

        .btn-approve:hover {
            background: #d68910;
        }

        #launchStatus {
            margin-top: 12px;
            font-size: 14px;
            color: var(--green);
            display: none;
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .ticker {
                grid-template-columns: repeat(2, 1fr);
            }
            .wallet {
                flex-direction: column;
                align-items: stretch;
            }
            .token-item {
                flex-direction: column;
                align-items: stretch;
            }
            .token-item .balance {
                align-items: flex-start;
            }
            .token-item .actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MWA • Launch & Trade</h1>

        <!-- Wallet -->
        <div class="wallet">
            <div class="wallet-info">
                <div id="walletState">Wallet not connected</div>
                <div class="wallet-address" id="walletAddress">—</div>
            </div>
            <button id="connectBtn">Connect MetaMask</button>
        </div>

        <!-- Ticker -->
        <div class="ticker">
            <div class="card"><div class="symbol">AAPL</div><div class="price" id="AAPL">--</div></div>
            <div class="card"><div class="symbol">TSLA</div><div class="price" id="TSLA">--</div></div>
            <div class="card"><div class="symbol">NVDA</div><div class="price" id="NVDA">--</div></div>
            <div class="card"><div class="symbol">AMD</div><div class="price" id="AMD">--</div></div>
        </div>

        <!-- Launch Token -->
        <div class="section">
            <h2>📦 Launch New Token</h2>
            <div class="grid">
                <div>
                    <label>Token Name</label>
                    <input id="tokenName" placeholder="e.g. My Meme Token" value="My Meme" maxlength="60">
                </div>
                <div>
                    <label>Token Symbol</label>
                    <input id="tokenSymbol" placeholder="e.g. MEME" value="MEME" maxlength="20">
                </div>
                <div>
                    <label>Token Supply</label>
                    <input id="tokenSupply" type="number" value="1000000">
                </div>
                <div>
                    <label>RWA Asset</label>
                    <select id="assetSelect">
                        <option value="0xC9f9c86933092BbbfFF3CCb4b105A4A94bf3Bd4E">AMD</option>
                        <option value="0x71178BAc73cBeb415514eB542a8995b82669778d">TSLA</option>
                        <option value="0x7dF7F09271136b49bD1E44937FA758264024858C">AAPL</option>
                    </select>
                    <span style="font-size:12px;color:#9cb4ad;margin-top:4px;display:block;">Select token from your wallet</span>
                </div>
                <div>
                    <label>Asset Amount (wei)</label>
                    <input id="assetAmount" value="1000000000000000000">
                </div>
                <div>
                    <label>Lock Duration (seconds)</label>
                    <input id="lockDuration" type="number" value="600" min="60">
                </div>
            </div>
            <button style="margin-top:20px;width:100%;" id="depositBtn" disabled>🚀 Launch Token</button>
            <div id="launchStatus"></div>
        </div>

        <!-- Token List -->
        <div class="section">
            <h2>📊 Your Tokens</h2>
            <div id="tokenList">
                <div style="color: #9cb4ad; padding: 20px; text-align: center;">No tokens launched yet.</div>
            </div>
        </div>

        <!-- Redeem -->
        <div class="section">
            <h2>🔄 Redeem RWA</h2>
            <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;">
                <div>
                    <label>Deposit ID</label>
                    <input id="depositId" value="1">
                </div>
                <button id="redeemBtn" disabled style="margin-bottom:2px;">Redeem</button>
            </div>
            <button id="approveBtn" style="margin-top:12px;width:100%;background:#f39c12;color:#000;" disabled>Approve Meme Token for Vault</button>
        </div>

        <div class="status" id="status">Ready.</div>
        <div class="footer">MWA Protocol v2</div>
    </div>

    <script>
        "use strict";

        // =========================================================
        // CONFIG
        // =========================================================
        const CONFIG = {
            CHAIN_ID: 46630,
            CHAIN_HEX: "0xb626",
            CHAIN_NAME: "Robinhood Testnet",
            RPC_URL: "https://rpc.testnet.chain.robinhood.com",
            EXPLORER: "https://explorer.testnet.chain.robinhood.com",
            VAULT_ADDRESS: "0xb91De23C83679567d6664854E2DE7856db56DF90",
            TOKEN_ADDRESS: "0xdBB8401ee6c808c747578C680e6b65AEFBAc6484",
            FACTORY_ADDRESS: "0x6F4B2b5629798D810147d7E61BD3f4e121d10f21" // ЗАМЕНИТЕ
        };

        // =========================================================
        // DOM
        // =========================================================
        const connectBtn = document.getElementById("connectBtn");
        const walletState = document.getElementById("walletState");
        const walletAddress = document.getElementById("walletAddress");
        const status = document.getElementById("status");
        const depositBtn = document.getElementById("depositBtn");
        const redeemBtn = document.getElementById("redeemBtn");
        const approveBtn = document.getElementById("approveBtn");
        const tokenName = document.getElementById("tokenName");
        const tokenSymbol = document.getElementById("tokenSymbol");
        const tokenSupply = document.getElementById("tokenSupply");
        const assetSelect = document.getElementById("assetSelect");
        const assetAmount = document.getElementById("assetAmount");
        const lockDuration = document.getElementById("lockDuration");
        const depositId = document.getElementById("depositId");
        const tokenList = document.getElementById("tokenList");
        const launchStatus = document.getElementById("launchStatus");

        // =========================================================
        // APP STATE
        // =========================================================
        const APP = {
            provider: null,
            signer: null,
            account: null,
            vault: null,
            token: null,
            connected: false,
            eventsAdded: false,
            tokens: []
        };

        // =========================================================
        // ABI
        // =========================================================
        const TOKEN_ABI = [
            "function balanceOf(address owner) view returns(uint256)",
            "function allowance(address owner, address spender) view returns(uint256)",
            "function approve(address spender, uint256 amount) returns(bool)"
        ];

        const VAULT_ABI = [
            "function depositRWA(address,uint256,address,uint256,uint256)",
            "function redeemRWA(uint256)",
            "function depositCounter() view returns(uint256)",
            "function getDeposit(uint256) view returns(tuple(address assetAddress, uint256 assetAmount, address memeToken, uint256 memeTokenAmount, uint256 redemptionDeadline, bool isRedeemed, bool isClaimed))"
        ];

        const FACTORY_ABI = [
            "function createToken(string name, string symbol, address vault) external returns (address)"
        ];

        const ERC20_ABI = [
            "function decimals() view returns(uint8)",
            "function symbol() view returns(string)",
            "function balanceOf(address) view returns(uint256)",
            "function allowance(address,address) view returns(uint256)",
            "function approve(address,uint256) returns(bool)"
        ];

        // =========================================================
        // PRICES
        // =========================================================
        const PRICE_CONFIG = {
            UPDATE_INTERVAL: 15000,
            API_URL: "https://requests-awareness-chair-lodge.trycloudflare.com/api/quotes",
            SYMBOLS: ["AAPL", "TSLA", "NVDA", "AMD"]
        };

        // =========================================================
        // HELPERS
        // =========================================================
        function setStatus(text, type = "success") {
            status.innerText = text;
            status.className = "status";
            if (type === "error") status.classList.add("error");
            if (type === "success") status.classList.add("success");
            if (type === "pending") status.classList.add("pending");
        }

        function shortAddress(addr) {
            if (!addr) return "—";
            return addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
        }

        function formatPrice(price) {
            return "$" + Number(price).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function parseBigInt(value) {
            try {
                if (value.startsWith("0x")) return BigInt(value);
                return BigInt(value);
            } catch {
                return null;
            }
        }

        function disableButtons(flag) {
            depositBtn.disabled = flag;
            redeemBtn.disabled = flag;
            approveBtn.disabled = flag;
        }

        // =========================================================
        // TOKEN LIST
        // =========================================================
        function loadTokensFromStorage() {
            try {
                const data = localStorage.getItem('mwa_tokens');
                if (data) {
                    APP.tokens = JSON.parse(data);
                } else {
                    APP.tokens = [];
                }
            } catch (e) {
                APP.tokens = [];
            }
            renderTokenList();
        }

        function saveTokensToStorage() {
            try {
                localStorage.setItem('mwa_tokens', JSON.stringify(APP.tokens));
            } catch (e) {
                console.warn('Could not save tokens to localStorage');
            }
        }

        async function renderTokenList() {
            if (APP.tokens.length === 0) {
                tokenList.innerHTML =
                    '<div style="color: #9cb4ad; padding: 20px; text-align: center;">No tokens launched yet.</div>';
                return;
            }

            let html = '';
            
            for (let i = 0; i < APP.tokens.length; i++) {
                const token = APP.tokens[i];
                const totalSupply = parseInt(token.supply) || 0;
                const availableForSale = totalSupply;
                
                // Получаем реальный баланс из блокчейна
                let realBalance = 0;
                if (APP.connected && APP.signer) {
                    try {
                        const contract = new ethers.Contract(token.address, TOKEN_ABI, APP.signer);
                        const bal = await contract.balanceOf(APP.account);
                        realBalance = Number(bal);
                        token.balance = bal.toString();
                    } catch (e) {
                        realBalance = Number(token.balance || 0);
                    }
                } else {
                    realBalance = Number(token.balance || 0);
                }

                html += `
                        <div class="token-item">
                            <div class="info">
                                <div class="name">${token.name} (${token.symbol})</div>
                                <div class="address">${shortAddress(token.address)}</div>
                            </div>
                            <div class="balance">
                                <div style="color: #00d395;">Balance: ${realBalance.toLocaleString()}</div>
                                <div class="available">For sale: ${availableForSale.toLocaleString()}</div>
                            </div>
                            <div class="actions">
                                <input type="number" class="buy-sell-input" id="amount_${i}" value="1" min="1">
                                <button class="small btn-buy" data-index="${i}">Buy</button>
                                <button class="small btn-sell" data-index="${i}">Sell</button>
                            </div>
                        </div>
                    `;
            }

            tokenList.innerHTML = html;

            // Привязываем обработчики
            document.querySelectorAll('.btn-buy').forEach(btn => {
                btn.onclick = function() {
                    const index = parseInt(this.dataset.index);
                    buyToken(index);
                };
            });
            document.querySelectorAll('.btn-sell').forEach(btn => {
                btn.onclick = function() {
                    const index = parseInt(this.dataset.index);
                    sellToken(index);
                };
            });
        }

        function addTokenToUI(name, symbol, address, supply) {
            const exists = APP.tokens.some(t => t.address === address);
            if (!exists) {
                APP.tokens.push({
                    name: name,
                    symbol: symbol,
                    address: address,
                    supply: supply.toString(),
                    balance: supply.toString()
                });
                saveTokensToStorage();
                renderTokenList();

                launchStatus.style.display = 'block';
                launchStatus.textContent = `✅ ${name} (${symbol}) launched! Supply: ${Number(supply).toLocaleString()}`;
                launchStatus.style.color = '#00d395';
                setTimeout(() => {
                    launchStatus.style.display = 'none';
                }, 8000);
            }
        }

        // =========================================================
        // BUY / SELL (Simulated - только локальное изменение)
        // =========================================================
        function buyToken(index) {
            const token = APP.tokens[index];
            if (!token) return;

            const amountInput = document.getElementById(`amount_${index}`);
            const amount = parseInt(amountInput.value) || 1;
            const currentBalance = Number(token.balance || 0);

            if (amount <= 0) {
                setStatus("❌ Amount must be greater than 0", "error");
                return;
            }

            const newBalance = currentBalance + amount;
            token.balance = newBalance.toString();
            saveTokensToStorage();
            renderTokenList();

            setStatus(`✅ Bought ${amount} ${token.symbol} (simulated). New balance: ${newBalance}`, "success");
        }

        function sellToken(index) {
            const token = APP.tokens[index];
            if (!token) return;

            const amountInput = document.getElementById(`amount_${index}`);
            const amount = parseInt(amountInput.value) || 1;
            const currentBalance = Number(token.balance || 0);

            if (amount <= 0) {
                setStatus("❌ Amount must be greater than 0", "error");
                return;
            }

            if (amount > currentBalance) {
                setStatus(`❌ Not enough ${token.symbol} to sell. Balance: ${currentBalance}`, "error");
                return;
            }

            const newBalance = currentBalance - amount;
            token.balance = newBalance.toString();
            saveTokensToStorage();
            renderTokenList();

            setStatus(`✅ Sold ${amount} ${token.symbol} (simulated). New balance: ${newBalance}`, "success");
        }

        // =========================================================
        // WALLET UI
        // =========================================================
        function updateWalletUI() {
            if (APP.connected) {
                walletState.innerHTML = "Wallet Connected";
                walletAddress.innerHTML = shortAddress(APP.account);
                connectBtn.innerHTML = "Connected";
                checkFormValidity();
            } else {
                walletState.innerHTML = "Wallet not connected";
                walletAddress.innerHTML = "—";
                connectBtn.innerHTML = "Connect MetaMask";
                depositBtn.disabled = true;
                redeemBtn.disabled = true;
                approveBtn.disabled = true;
            }
        }

        function checkFormValidity() {
            if (!APP.connected) {
                depositBtn.disabled = true;
                redeemBtn.disabled = true;
                approveBtn.disabled = true;
                return;
            }

            const name = tokenName.value.trim();
            const symbol = tokenSymbol.value.trim();
            const supply = tokenSupply.value.trim();
            const assetAddr = assetSelect.value.trim();
            const assetAmt = assetAmount.value.trim();

            const isValid = name && symbol && supply && parseInt(supply) > 0 && assetAddr && assetAmt;
            depositBtn.disabled = !isValid;
            redeemBtn.disabled = false;
            approveBtn.disabled = false;
        }

        // =========================================================
        // NETWORK
        // =========================================================
        async function ensureNetwork() {
            const chain = await APP.provider.getNetwork();
            if (Number(chain.chainId) !== CONFIG.CHAIN_ID) {
                try {
                    await window.ethereum.request({
                        method: "wallet_switchEthereumChain",
                        params: [{ chainId: CONFIG.CHAIN_HEX }]
                    });
                } catch (e) {
                    if (e.code === 4902) {
                        await window.ethereum.request({
                            method: "wallet_addEthereumChain",
                            params: [{
                                chainId: CONFIG.CHAIN_HEX,
                                chainName: CONFIG.CHAIN_NAME,
                                rpcUrls: [CONFIG.RPC_URL],
                                nativeCurrency: { name: "ETH", symbol: "ETH", decimals: 18 },
                                blockExplorerUrls: [CONFIG.EXPLORER]
                            }]
                        });
                    } else {
                        throw e;
                    }
                }
            }
        }

        // =========================================================
        // CONNECT WALLET
        // =========================================================
        async function connectWallet() {
            if (typeof window.ethereum === "undefined") {
                setStatus("MetaMask is not installed", "error");
                return;
            }
            connectBtn.disabled = true;
            connectBtn.innerHTML = "Connecting...";
            try {
                APP.provider = new ethers.BrowserProvider(window.ethereum);
                await ensureNetwork();
                const accounts = await APP.provider.send("eth_requestAccounts", []);
                APP.signer = await APP.provider.getSigner();
                APP.account = accounts[0];
                APP.vault = new ethers.Contract(CONFIG.VAULT_ADDRESS, VAULT_ABI, APP.signer);
                APP.connected = true;
                updateWalletUI();
                setStatus("Wallet connected successfully.");
                renderTokenList();
            } catch (e) {
                console.error(e);
                APP.connected = false;
                updateWalletUI();
                setStatus(e.message, "error");
            }
            connectBtn.disabled = false;
        }

        // =========================================================
        // APPROVE MEME TOKEN FOR VAULT
        // =========================================================
        async function approveMemeToken() {
            if (!APP.connected) {
                setStatus("Connect wallet first.", "error");
                return;
            }

            // Берем первый токен из списка
            if (APP.tokens.length === 0) {
                setStatus("No meme tokens found. Launch a token first.", "error");
                return;
            }

            const tokenAddress = APP.tokens[0].address;
            approveBtn.disabled = true;
            setStatus("⏳ Approving meme token for Vault...", "pending");

            try {
                const token = new ethers.Contract(tokenAddress, TOKEN_ABI, APP.signer);
                const allowance = await token.allowance(APP.account, CONFIG.VAULT_ADDRESS);
                const amount = ethers.MaxUint256;

                if (allowance >= amount) {
                    setStatus(`✅ Already approved for Vault`, "success");
                    approveBtn.disabled = false;
                    return;
                }

                const tx = await token.approve(CONFIG.VAULT_ADDRESS, amount);
                setStatus("⏳ Waiting for approval confirmation...", "pending");
                await tx.wait();

                setStatus(`✅ Meme token approved for Vault!`, "success");
            } catch (e) {
                console.error(e);
                setStatus(`❌ Approval failed: ${e.message}`, "error");
            }
            approveBtn.disabled = false;
        }

        // =========================================================
        // DEPOSIT
        // =========================================================
        async function executeDeposit() {
            if (!APP.connected) {
                setStatus("Connect wallet first.", "error");
                return;
            }
            disableButtons(true);
            try {
                const name = tokenName.value.trim();
                const symbol = tokenSymbol.value.trim();
                const supply = BigInt(tokenSupply.value.trim());
                const rwaAddress = assetSelect.value.trim();
                const rwaAmount = parseBigInt(assetAmount.value.trim());
                const duration = Number(lockDuration.value);

                if (!name) throw new Error("Token name required.");
                if (!symbol) throw new Error("Token symbol required.");
                if (supply <= 0n) throw new Error("Supply must be positive.");
                if (!ethers.isAddress(rwaAddress)) throw new Error("Invalid asset address.");
                if (rwaAmount === null) throw new Error("Invalid amount.");
                if (duration < 60) throw new Error("Lock duration must be at least 60 seconds.");

                setStatus(`Creating token: ${name} (${symbol})...`);

                const factory = new ethers.Contract(
                    CONFIG.FACTORY_ADDRESS,
                    FACTORY_ABI,
                    APP.signer
                );

                const txCreate = await factory.createToken(name, symbol, CONFIG.VAULT_ADDRESS);
                const receiptCreate = await txCreate.wait();

                let newTokenAddress = null;
                for (const log of receiptCreate.logs) {
                    try {
                        const parsedLog = factory.interface.parseLog(log);
                        if (parsedLog && parsedLog.name === 'TokenCreated') {
                            newTokenAddress = parsedLog.args.token;
                            break;
                        }
                    } catch (e) {
                        continue;
                    }
                }

                if (!newTokenAddress) {
                    throw new Error(`Could not get token address.`);
                }

                console.log('New token address:', newTokenAddress);
                setStatus(`Token created: ${newTokenAddress}`);

                // Approve RWA
                setStatus("Checking RWA allowance...");
                await approveRWA(rwaAddress, rwaAmount);

                // Deposit
                setStatus("Sending deposit...");
                const vault = new ethers.Contract(CONFIG.VAULT_ADDRESS, VAULT_ABI, APP.signer);
                const tx = await vault.depositRWA(
                    rwaAddress,
                    rwaAmount,
                    newTokenAddress,
                    supply,
                    duration
                );

                setStatus("Waiting confirmation...");
                const receipt = await tx.wait();

                if (receipt.status !== 1) throw new Error("Transaction failed.");

                const id = await vault.depositCounter();
                depositId.value = id.toString();

                addTokenToUI(name, symbol, newTokenAddress, supply);
                setStatus(`✅ ${name} (${symbol}) launched! Deposit ID: ${id}`, "success");

            } catch (e) {
                console.error(e);
                setStatus(e.reason || e.shortMessage || e.message, "error");
            }
            disableButtons(false);
        }

        // =========================================================
        // APPROVE RWA
        // =========================================================
        async function approveRWA(tokenAddress, amount) {
            const token = new ethers.Contract(tokenAddress, ERC20_ABI, APP.signer);
            const allowance = await token.allowance(APP.account, CONFIG.VAULT_ADDRESS);
            if (allowance >= amount) return true;
            setStatus("Approving RWA token...", "pending");
            const tx = await token.approve(CONFIG.VAULT_ADDRESS, ethers.MaxUint256);
            await tx.wait();
            return true;
        }

        // =========================================================
        // REDEEM
        // =========================================================
        async function executeRedeem() {
            if (!APP.connected) {
                setStatus("Connect wallet first.", "error");
                return;
            }
            disableButtons(true);
            try {
                const id = Number(depositId.value);
                if (id <= 0) throw new Error("Invalid deposit id.");

                const vault = new ethers.Contract(CONFIG.VAULT_ADDRESS, VAULT_ABI, APP.signer);
                
                let info;
                try {
                    info = await vault.getDeposit(id);
                } catch (e) {
                    throw new Error(`Deposit ID ${id} does not exist. Create a new deposit first.`);
                }

                // Проверяем срок
                const deadline = Number(info.redemptionDeadline);
                const now = Math.floor(Date.now() / 1000);
                if (deadline === 0) {
                    throw new Error(`Deposit ID ${id} has no deadline set. Please check the deposit.`);
                }
                if (now > deadline) {
                    throw new Error(`Deposit ID ${id} expired. Create a new deposit.`);
                }

                if (info.isRedeemed) {
                    throw new Error(`Deposit ID ${id} is already redeemed.`);
                }

                // Проверяем баланс мем-токенов
                const memeToken = info.memeToken;
                const memeTokenAmount = Number(info.memeTokenAmount);
                
                const token = new ethers.Contract(memeToken, TOKEN_ABI, APP.signer);
                const balance = await token.balanceOf(APP.account);
                if (Number(balance) < memeTokenAmount) {
                    throw new Error(`Not enough meme tokens. Need ${memeTokenAmount}, have ${Number(balance)}`);
                }

                setStatus(`⏳ Redeeming deposit ${id}...`, "pending");
                const tx = await vault.redeemRWA(id);
                setStatus("⏳ Waiting for confirmation...", "pending");
                const receipt = await tx.wait();

                if (receipt.status !== 1) throw new Error("Redeem failed.");

                setStatus(`✅ Deposit ${id} redeemed successfully!`, "success");
                renderTokenList();

            } catch (e) {
                console.error('Redeem error:', e);
                setStatus(`❌ ${e.message || 'Redeem failed'}`, "error");
            }
            disableButtons(false);
        }

        // =========================================================
        // PRICES
        // =========================================================
        async function refreshPrices() {
            try {
                const response = await fetch(PRICE_CONFIG.API_URL);
                if (!response.ok) throw new Error("HTTP " + response.status);
                const prices = await response.json();
                prices.forEach(item => {
                    const el = document.getElementById(item.symbol);
                    if (!el) return;
                    el.textContent = formatPrice(item.price);
                    el.style.color = item.change >= 0 ? "#00d395" : "#ff5555";
                });
            } catch (e) {
                console.error("Price error:", e);
                document.querySelectorAll('.price').forEach(el => el.textContent = "N/A");
            }
        }

        // =========================================================
        // EVENTS
        // =========================================================
        connectBtn.onclick = connectWallet;
        depositBtn.addEventListener("click", executeDeposit);
        redeemBtn.addEventListener("click", executeRedeem);
        approveBtn.addEventListener("click", approveMemeToken);

        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('input', checkFormValidity);
            el.addEventListener('change', checkFormValidity);
        });

        // =========================================================
        // INIT
        // =========================================================
        async function initializeApplication() {
            console.log("========================================");
            console.log("MWA Launch & Trade v2");
            console.log("========================================");
            try {
                if (typeof window.ethereum === "undefined") {
                    setStatus("MetaMask not detected.", "error");
                    console.warn("MetaMask not installed.");
                    return;
                }
                APP.provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await APP.provider.send("eth_accounts", []);
                if (accounts.length) {
                    console.log("Found authorized wallet.");
                    await connectWallet();
                } else {
                    updateWalletUI();
                    setStatus("Click Connect MetaMask.", "success");
                }
                loadTokensFromStorage();
                console.log("Application ready.");
            } catch (e) {
                console.error(e);
                setStatus(e.message, "error");
            }
        }

        initWalletEvents();
        autoConnect();
        initializeApplication();

        // =========================================================
        // HELPER FUNCTIONS
        // =========================================================
        function initWalletEvents() {
            if (APP.eventsAdded) return;
            APP.eventsAdded = true;
            window.ethereum.on("accountsChanged", async (accounts) => {
                if (accounts.length === 0) {
                    APP.connected = false;
                    updateWalletUI();
                    return;
                }
                await connectWallet();
            });
            window.ethereum.on("chainChanged", () => {
                window.location.reload();
            });
        }

        async function autoConnect() {
            if (typeof window.ethereum === "undefined") return;
            try {
                APP.provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await APP.provider.send("eth_accounts", []);
                if (accounts.length) {
                    await connectWallet();
                }
            } catch (e) {
                console.log(e);
            }
        }

        // Обновляем балансы каждые 15 секунд
        setInterval(async () => {
            if (APP.connected) {
                await renderTokenList();
            }
        }, 15000);

        setInterval(async () => {
            try { await refreshPrices(); } catch (e) { console.log(e); }
        }, 15000);

        document.addEventListener("visibilitychange", async () => {
            if (document.hidden) return;
            if (APP.connected) await renderTokenList();
            await refreshPrices();
        });

        console.log("MWA initialized successfully");
        console.log("========================================");
    </script>

</body>
</html>
